    CommandExecuteAwaitRequest:
      allOf:
        - $ref: '#/components/schemas/CommandExecuteRequest'
        - type: object
          properties:
            timeoutMs:
              type: integer
              format: int32
              description: 等待设备命令上报超时（毫秒）；不传使用服务端默认值。
              minimum: 1000
              maximum: 10000

    CommandExecuteAwaitResult:
      type: object
      required: [deviceId, endpointId, functionCode, commandCode, code, message, responded]
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能编码。
        commandCode:
          type: string
          description: 命令编码。
        code:
          type: integer
          description: 执行结果码。
        message:
          type: string
          description: 执行结果描述。
        responded:
          type: boolean
          description: 是否收到设备该 command 的上报。
        commandReportValue:
          type: string
          description: 设备该 command 的上报原始字符串，由调用端自行解析。
        responseTime:
          type: integer
          format: int64
          description: 设备 command 上报时间（毫秒时间戳）。

    CommandExecuteAwaitResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/CommandExecuteAwaitResult'
      example:
        type: ExecuteCommandAwaitResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-00000000001a"
        code: 0
        message: success
        data:
          - deviceId: "gateway001"
            endpointId: 1
            functionCode: NetworkCommissioning
            commandCode: TriggerZigbeeNetworkInfoUpload
            code: 0
