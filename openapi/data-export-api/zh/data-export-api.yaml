  /resource-types/{type}/resources:
    get:
      tags: [Resource]
      summary: 分页查询资源
      description: "分页查询指定类型的资源。仅可使用该资源类型定义中 query.filters 声明的筛选条件，传入未声明的查询参数会返回 400。\nparentId 只适用于声明了该筛选条件的层级资源；protocolId 只适用于协议资源。page 默认 1，pageSize 默认 20、最大 100。\nsort 格式为 `字段:asc` 或 `字段:desc`，字段必须出现在 query.sortable 中；未传时默认 id:asc。\n分页结果不计算 total，以 hasMore 表示是否还有下一页。调用前可通过 GET /resource-types/{type} 获取当前运行时规则。\n\nprotocol.network/device/point 列表项返回只读 protocolId；协议设备和点按可见性及授权返回业务 deviceId。点返回控制引用状态和可用时的完整引用。发现候选携带 protocolId/jobId，新 Resource 任务保留 owner 上下文。\n\n查询 `type=sequence` 时：\n- 不传 `deviceId` 返回用户自定义序列库。\n- 传 `deviceId` 默认只返回该设备已拥有的情景（已绑定用户配置、设备预设、系统内置）；已属于当前设备的条目带 `properties.assignment`。\n- `includeAssignable=true` 时额外返回尚未绑定、能力匹配、可供选择的用户情景（无 `properties.assignment`）。省略或 `false` 不返回待分配情景。不传 `deviceId` 时忽略该参数。\n- 内置情景的 `properties.name`、`properties.labelTypeName` 按请求头 `Lang` 返回本地化文案。\n- 带 `deviceId` 时查询响应 data 中回显 `deviceId` 和该设备 `spec`（data.deviceId/data.spec）。\n调用此接口前，请通过调用 [GET /resource-types/{type}](https://docs.aqara.com/zh/docs/aqara-developer/data-export-api/describe-resource-type) 接口，查询待查询资源类型的定义。"
      operationId: queryResources
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
      - $ref: '#/components/parameters/ResourceType'
      - name: parentId
        in: query
        required: false
        description: parentId 只适用于声明了该筛选条件的层级资源。
        schema:
          type: string
        description: 运行节点 ID 作为子树根；包含全部后代，不是仅直接孩子的 parent 筛选，也不是业务 deviceId。仅用于声明支持的类型。
      - name: protocolId
        in: query
        required: false
        description: protocolId 只适用于协议资源。
        schema:
          type: string
        description: 协议类型标识，例如 modbus；不是目录 Resource 句柄 protocol:modbus，也不是具体设备 ID。
      - name: page
        in: query
        required: false
        description: 页码，默认为 1。
        schema:
          type: integer
          minimum: 1
          default: 1
          maximum: 1000000
      - name: pageSize
        in: query
        required: false
        description: 每页条数，默认为 20，最大为 100。
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: sort
        in: query
        required: false
        description: sort 格式为 `字段:asc` 或 `字段:desc`，字段必须出现在 query.sortable 中；未传时使用资源类型定义的 defaultSort。
        schema:
          type: string
          default: id:asc
      - name: name
        in: query
        required: false
        description: 仅用于 query.filters 包含 name 的类型，精确匹配。 按资源名称精确筛选。sequence 类型已声明该条件。
        schema:
          type: string
      - name: jobId
        in: query
        required: false
        description: discovery 必填：发现任务资源 ID。
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: discovery 必填：device 或 point。
        schema:
          type: string
          enum:
          - device
          - point
      - name: deviceId
        in: query
        required: false
