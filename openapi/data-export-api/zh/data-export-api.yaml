# ══════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════
components:

  responses:
    BadRequestResponse:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000001"
              code: 400
              message: "参数 xxx 不能为空"
    UnauthorizedResponse:
      description: 未认证或认证失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000002"
              code: 401
              message: "token 已过期，请重新生成 token"
    ForbiddenResponse:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example: 
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000003"
              code: 403
              message: "无权限访问该资源"
    ConflictResponse:
      description: 当前资源状态与请求冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityResponse:
      description: 请求格式正确，但协议、实体或配置不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundResponse:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000004"
              code: 404
              message: "资源不存在"
    TooManyRequestsResponse:
      description: 请求频率过高
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000005"
              code: 429
              message: "请求频率过高"
    InternalServerErrorResponse:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000006"
              code: 500
              message: "服务内部异常"
    BadGatewayResponse:
      description: Edge 或 Cloud 命令调用失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 502
              message: "Edge or Cloud command call failed"
    ServiceUnavailableResponse:
      description: 服务不可用；通常表示当前为 Edge 端，或 Cloud 端 cloudlinkcloud 服务未加载
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 503
              message: "服务暂时不可用"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <Token>"

  # 公共请求头参数（所有接口均需携带，由客户端统一附加）
  parameters:
    ResourceType:
      name: type
      in: path
      required: true
      description: 稳定的对外资源类型，例如 system、protocol.network、protocol.device、protocol.point
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      description: 全局唯一资源 ID；普通资源和协议资源均使用接口返回的 id 原样传入
      schema:
        type: string

  schemas:

    # ── 基础请求 / 响应 ──────────────────────────────────────────
    BaseResponse:
      type: object
      required: [type, version, msgId, code]
      properties:
        type:
          type: string
          description: 消息类型
        version:
          type: string
          description: 接口版本
          example: v1
        msgId:
          type: string
          description: 消息 ID
        code:
          type: integer
          description: "业务状态码，0 表示成功"
        message:
          type: string
          description: 提示信息

    ErrorResponse:
      description: 错误响应，错误信息通过 code 与 message 提供
      allOf:
        - $ref: '#/components/schemas/BaseResponse'

    # ── 通用 ANode 资源 ──────────────────────────────────────────
    ResourceUpdateRequest:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          minProperties: 1
          additionalProperties: true
          description: 待修改的白名单字段，使用普通 JSON 标量

    ResourceActionRequest:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: 服务端返回的不透明资源 ID
        input:
          type: object
          additionalProperties: true
          default: {}
          description: 命令输入参数；具体字段以资源类型定义返回的命令 Schema 为准

    ResourceOpenApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: 命令的同步结果或后台任务信息，结构以资源类型定义中的命令输出 Schema 为准

    ResourceHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, disabled, fault, down, stale, "null", alarm, overridden, unackedAlarm, unknown]
          description: 根据 Studio 当前 enabled、status、faultCause 归一化的只读状态；不主动探测设备
        enabled:
          type: boolean
        faultCause:
          type: string

    ResourceItem:
      type: object
      description: |
        sequence 资源在列表和详情中将可解析的历史效果转换为 properties.data.type=commands。
        无法解析时保留 ID、名称、revision、绑定及原始 format，返回
        properties.data={"type":"unavailable","reason":"Effect data cannot be represented as commands"}，
        不返回步骤 commands 或原始协议字节，不修改存储。unavailable 资源禁止属性更新、assign 和 retry。
        用户配置仍可解绑，无绑定时可删除；仅绑定为 SYNCED 且 syncedRevision=revision 时可启动。
        资源顶层 commands 是允许的操作名称，与 properties.data.commands 效果步骤不同。
        create/preview 只接受 commands 数据，不接受 unavailable。
        sequence 的 assign 输入仅接受 deviceId，始终分配最新版本；传入 revision（包括 null）会被拒绝。
      required: [id, type, properties]
      properties:
        id:
          type: string
        type:
          type: string
        protocolId:
          type: string
          description: 协议资源返回；普通 ANode 资源不返回
        properties:
          type: object
          additionalProperties: true
          description: 对外属性值集合；值使用普通 JSON 标量或业务对象，不返回 Studio 内部 path/type/value 包装，也不包含动态 Schema 标记为 writeOnly 的敏感配置
        schema:
          type: object
          additionalProperties: true
          description: 按 ID 读取协议资源时返回的动态配置 Schema；敏感字段标记 sensitive=true、writeOnly=true、readable=false
        health:
          $ref: '#/components/schemas/ResourceHealth'

    ResourceTypeSummary:
      type: object
      required: [type, operations, commands]
      properties:
        type:
          type: string
          description: 资源类型。
        operations:
          type: array
          description: 此类型支持的操作列表。
          items:
            type: string
            enum: [query, get, update]
        commands:
          type: array
          description: 此类型支持的命令列表。
          items:
            type: string

    ResourceTypesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: 对外资源类型定义列表。
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceTypeSummary'

    ResourceTypeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: true
              description: 对外资源类型定义；协议资源包含各 protocolId 的动态配置 Schema 和只读 health Schema。

    ResourceQueryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [type, items, page, pageSize, hasMore]
              description: 分页结果不计算 total，以 hasMore 表示是否还有下一页。
              properties:
                type:
                  type: string
                  description: 资源类型。
                items:
                  type: array
                  description: 资源列表。
                  items:
                    $ref: '#/components/schemas/ResourceItem'
                page:
                  type: integer
                  description: 当前页码。
                  minimum: 1
                pageSize:
                  type: integer
                  description: 每页条数。
                  minimum: 1
                hasMore:
                  type: boolean
                  description: 是否还有下一页。

    ResourceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ResourceItem'

    # ── Space ────────────────────────────────────────────────────
    SpaceNode:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: 空间 ID。
        parentSpaceId:
          type: string
          nullable: true
          description: 父空间 ID。
        name:
          type: string
          description: 空间名称。
        spatialMarking:
          type: string
          nullable: true
          description: 空间标记。
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: 子空间列表（递归结构）。

    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        parentSpaceId:
          type: string
          nullable: true
