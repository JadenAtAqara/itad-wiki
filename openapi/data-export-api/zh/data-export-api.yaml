            responded: true
            commandReportValue: "{\"result\":\"ok\"}"
            responseTime: 1710001234567

    # ── Gateway ──────────────────────────────────────────────────
    GatewayInfo:
      type: object
      required: [deviceId, deviceName]
      properties:
        deviceId:
          type: string
          description: 网关设备 ID。
        deviceName:
          type: string
          description: 网关设备名称。
        supportZigbee:
          type: boolean
          description: 是否支持 Zigbee，缺省或 null 为不支持。
        supportedMatterRoles:
          type: integer
          description: |
            支持的 Matter 角色，缺少或 null 为不支持。
            该字段为位掩码，使用 `supportedMatterRoles & 角色值 != 0` 判断是否支持对应角色：
            - 1：Matter controller
            - 2：Matter commissioner
            - 4：Thread border router
            - 8：Matter bridge
            例如 `supportedMatterRoles & 2 != 0` 表示支持 Matter 子设备入网。
          nullable: true
        space:
          $ref: '#/components/schemas/DeviceSpace'
          nullable: true
          description: 网关所在空间。

    GatewaysResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GatewayInfo'
      example:
        type: GetGatewaysResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-00000000000e"
        code: 0
        message: success
        data:
          - deviceId: "gateway-001"
            deviceName: "客厅网关M2"
            supportZigbee: true
            supportedMatterRoles: 1

