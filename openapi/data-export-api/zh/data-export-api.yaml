            query: null
            body: null
        pollDiscoveryJob:
          summary: 轮询设备发现任务
          description: "每 1000ms 读取一次，单轮最多 120000ms。只有 status=succeeded 且 commands 含 import 才进入导入；failed/cancelled 停止，unknown 停止并报告。超时保留原 jobId，恢复时读同一任务，不重提发现。新发现任务返回 protocolId、ownerKind、ownerId、targetKind；仍保存发现请求及 deviceJobId，旧任务缺少服务端上下文时必须重新发现，不能继续导入。"
          method: GET
