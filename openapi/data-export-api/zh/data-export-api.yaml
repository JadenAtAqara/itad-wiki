    # ── Firmware ───────────────────────────────────────────────────
    SearchUpgradableFirmwareByDeviceIdsRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SearchUpgradableFirmwareByDeviceIdsRequestData'

    SearchUpgradableFirmwareByDeviceIdsRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: 设备 ID 列表，最少 1 个、最多 200 个，且去重。
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
        includeDeviceTypes:
          type: array
          description: 包含的设备类型列表。为空时按缺省处理（不做白名单过滤）。
          uniqueItems: true
          items:
            type: string
        excludeDeviceTypes:
          type: array
          description: 不包含的设备类型列表。为空时按缺省处理（不做黑名单过滤）。`excludeDeviceTypes` 优先级高于 `includeDeviceTypes`。
          uniqueItems: true
          items:
            type: string

    UpgradeFirmwareDevice:
      type: object
      required: [did, firmware]
      properties:
        did:
          type: string
          description: 目标设备 ID

    UpgradeFirmwareRequestData:
      type: array
      minItems: 1
      maxItems: 1
      description: upgrade_handler 流程每次处理一个设备
      items:
        $ref: '#/components/schemas/UpgradeFirmwareDevice'

    UpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              description: 升级请求结果
              additionalProperties: false
            code:
              type: integer
              description: 请求结果码，0 表示升级请求已受理。
      example:
        type: UpgradeFirmwareResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data: {}

    DevicePointHistoryQueryRequest:
      type: object
      properties:
        deviceIds:
          type: array
          description: |
            设备 ID 列表，最多支持 200 个。

            <ul>
              <li>如果未传递 <code>deviceIds</code> 或为 <code>[]</code>，将查询当前请求上下文下可访问的所有设备。</li>
              <li><code>deviceIds</code> 如包含已被删除的设备，仍可获取对应设备的历史数据。</li>
            </ul>
       
          maxItems: 200
          default: []
          items:
            type: string
        traitCodes:
          type: array
          description: |
            Trait（功能点）code 列表，最多支持 200 个。

            <ul><li>若未传递或传递空数组，则查询目标设备的所有开放 traitCode。</li><li>若传递了本参数，无法识别的 code 会被忽略；如全部 code 都无法识别为 trait，则响应返回参数错误。</li></ul>
       
          maxItems: 200
          default: []
          items:
            type: string
        startTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            查询的起始时间，Unix 毫秒时间戳，包含该时间点。

            <ul><li>若未填写 <code>startTime</code> 和 <code>endTime</code>，默认查询最近 7 天的数据。</li><li>如仅填写其中一个参数，另一个将以 7 天为时间窗口自动推算补全。</li><li>cursor 分页时，需固定传递首次响应中的 <code>data.startTime</code> 和 <code>data.endTime</code>，保证数据连续一致。</li></ul>
        endTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            查询的结束时间，Unix 毫秒时间戳，不包含该时间点。必须大于 <code>startTime</code>，最大区间长度为 7 天。

            其他规则与 <code>startTime</code> 相同。
     
        descending:
          type: boolean
          default: true
          description: |
            是否按时间倒序。分页请求时，必须保证 <code>descending</code> 参数与首次请求一致。
            
            <ul><li><code>true</code>：是，按时间倒序。</li><li><code>false</code>：否，按时间正序。</li></ul>
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: 每页最大记录数，取值范围 [1, 200]。
        cursor:
          type: string
          nullable: true
          description: |
            分页游标。<ul><li>首次请求无需传递；如需获取下一页数据，请传递上一次响应中的 nextCursor。</li><li>分页请求时，必须保证 <code>deviceIds</code>、<code>traitCodes</code>、<code>startTime</code>、<code>endTime</code> 和 <code>descending</code> 参数与首次请求一致。</li></ul>

    DevicePointHistoryItem:
      type: object
      required: [deviceId, value, unit, time]
      properties:
        deviceId:
          type: string
          description: 历史记录所属设备 ID。
        deviceName:
          type: string
          nullable: true
          description: 当前设备名称；设备已删除或无法解析时省略。
        endpointId:
          type: integer
          format: int32
          nullable: true
          description: 当前点位 endpoint ID；点位已删除或重标记时省略。
        functionCode:
          type: string
          nullable: true
          description: 当前点位 function 对应的 Spec code；无法解析时省略。
        traitCode:
          type: string
          nullable: true
          description: 历史 trait 对应的 Spec code；无法解析时省略。
        value:
          description: 类型化 JSON 标量；数值、布尔值、枚举序号或字符串。NaN 和正负 Infinity 返回 null。
          oneOf:
            - type: number
            - type: boolean
            - type: string
              nullable: true
        valueName:
          type: string
          nullable: true
          description: Boolean 或枚举值对应的 trait 业务显示文本；无匹配或无翻译时省略。
        pointName:
          type: string
          nullable: true
          description: 当前点位名称；无法解析时省略。
        triggerName:
          type: string
          nullable: true
          description: 当前触发节点名称；无法解析时省略。
        unit:
          type: string
          description: 历史记录单位。
        time:
          type: integer
          format: int64
          description: 历史记录时间，Unix 毫秒时间戳。

    DevicePointHistoryQueryData:
      type: object
      required: [items, startTime, endTime]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DevicePointHistoryItem'
        nextCursor:
          type: string
          nullable: true
          description: 下一页不透明游标；为空或省略表示已到末页。
        startTime:
          type: integer
          format: int64
          description: Server-resolved query start time in Unix milliseconds. Reuse it when continuing with cursor.
        endTime:
          type: integer
          format: int64
          description: Server-resolved query end time in Unix milliseconds. Reuse it when continuing with cursor.

    DevicePointHistoryQueryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            type:
              type: string
              enum: [DevicePointHistoryQueryResponse]
            version:
              type: string
              enum: [v1]
            data:
              $ref: '#/components/schemas/DevicePointHistoryQueryData'
      example:
        type: DevicePointHistoryQueryResponse
        version: v1
        msgId: "history-query-1"
        code: 0
        message: success
        data:
          items:
            - deviceId: "device-001"
              deviceName: "Living room light"
              endpointId: 1
              functionCode: Light
              traitCode: OnOff
              value: true
              valueName: "On"
              pointName: "Switch"
              triggerName: "Automation"
              unit: ""
              time: 1770639800000
          startTime: 1770114300000
          endTime: 1770639900000
          nextCursor: "opaque-next-cursor"

    SearchFirmwareUpgradeStatusRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: 设备 ID 列表，最少 1 个，最多 1000 个；重复设备 ID 不算非法，服务端会去重后查询。
          minItems: 1
          maxItems: 1000
          items:
            type: string

    FirmwareUpgradeStatusItem:
      type: object
      required: [did, progress, firmwareType, time]
      properties:
        did:
          type: string
          description: 设备 ID
        upgradeResult:
          type: integer
          nullable: true
          description: 升级结果。<br />null：升级中。<br />0：升级成功。<br />非 0：升级失败。
        progress:
          type: integer
          description: 升级进度百分比。
          minimum: 0
          maximum: 100
        firmwareType:
          type: string
          description: 固件类型。
        cause:
          type: string
          nullable: true
          description: 失败原因。`upgradeResult` 非 0 时返回。
        time:
          type: integer
          format: int64
          description: 升级状态更新时间戳，单位毫秒。

    SearchFirmwareUpgradeStatusResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 固件升级状态列表
          items:
            $ref: '#/components/schemas/FirmwareUpgradeStatusItem'

    SearchFirmwareUpgradeStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SearchFirmwareUpgradeStatusResponseData'
      example:
        type: SearchFirmwareUpgradeStatusResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data:
          items:
            - did: "device-001"
              upgradeResult: null
              progress: 50
              firmwareType: "main"
              cause: null
              time: 1710000000000
            - did: "device-002"
              upgradeResult: 0
              progress: 100
              firmwareType: "studio"
              cause: null
              time: 1710000001000

    CancelUpgradeFirmwareRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: 设备 ID 列表，最少 1 个，最多 200 个；重复设备 ID 不算非法，服务端会去重后下发。
          minItems: 1
          maxItems: 200
          items:
            type: string

    CancelUpgradeFirmwareResultItem:
      type: object
      required: [deviceId, resultCode]
      properties:
        deviceId:
          type: string
          description: 设备 ID
        resultCode:
          type: integer
          description: 单设备取消命令下发结果。<br />0：取消命令成功下发给网关，不表示网关实际取消升级成功；非 0：取消命令下发失败。

    CancelUpgradeFirmwareResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 单设备取消命令下发结果列表
          items:
            $ref: '#/components/schemas/CancelUpgradeFirmwareResultItem'

    CancelUpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CancelUpgradeFirmwareResponseData'
            code:
              type: integer
              description: 接口处理结果码，0 表示接口处理成功。单设备取消命令下发结果请查看 data.items[].resultCode。
      example:
        type: CancelUpgradeFirmwareResponse
        version: v1
        msgId: "4"
        code: 0
        message: success
        data:
          items:
            - deviceId: "device-001"
              resultCode: 0
            - deviceId: "device-002"
              resultCode: -1

    SearchUpgradableFirmwareByDeviceIdsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              description: 设备可升级固件查询结果
              required: [data]
              properties:
                data:
                  type: array
                  description: 设备可升级固件结果
                  items:
                    $ref: '#/components/schemas/UpgradableDeviceFirmwareItem'
      example:
        type: SearchUpgradableFirmwareByDeviceIdsResponse
        version: v1
        msgId: "2"
        code: 0
        message: success
        data:
          data:
            - deviceId: "device-001"
              deviceName: "卧室灯"
              state: true
              space:
                parentSpaceId: "space-home-001"
                name: "卧室"
                spaceId: "15sd85"
              upgradableFirmwares:
                - firmwareVersion: "99.99.99"
                  intVersion: null
                  filePath: "https://xxx"
                  fileSize: 123456
                  firmwareMd5: "xx"
                  firmwareCRC32: "xx"
                  firmwareSha256: null
                  firmwareType: "main"
                  updateLog: "固件升级说明"
                  model: ""
                  isNecessary: false
                  isForce: false
                  state: 3
                  releaseTime: 1710001234567

    UpgradableFirmwareType:
      type: string
      description: 固件类型
      enum: [main, zigbee, ai, matter, studio, rs485]

    UpgradableFirmwareInfo:
      type: object
      required: [firmwareVersion, filePath, fileSize, firmwareMd5, firmwareCRC32, firmwareType, isNecessary, isForce, state]
      properties:
        firmwareVersion:
          type: string
          description: 固件版本号
        intVersion:
          type: integer
          nullable: true
          description: Matter 类型固件整型版本号
        filePath:
          type: string
          description: 固件文件地址
        fileSize:
          type: integer
          format: int64
          description: 固件文件大小（byte）
        firmwareMd5:
          type: string
          description: 固件文件 MD5
        firmwareCRC32:
          type: string
          description: 固件文件 CRC32
        firmwareSha256:
          type: string
          nullable: true
          description: 固件文件 SHA256
        firmwareType:
          $ref: '#/components/schemas/UpgradableFirmwareType'
        updateLog:
          type: string
          nullable: true
          description: 固件升级说明
        model:
          type: string
          nullable: true
          description: 设备型号
        isNecessary:
          type: boolean
          description: 是否必经版本。true 表示必经，false 表示非必经
        isForce:
          type: boolean
          description: 是否强制升级
        state:
          type: integer
          description: 固件状态。<br />1：测试中，<br />2：灰度，<br />3：已上线，<br />5：beta 版本
          enum: [1, 2, 3, 5]
        releaseTime:
          type: integer
          format: int64
          nullable: true
          description: 固件上线生效时间（毫秒时间戳）

    UpgradableDeviceFirmwareItem:
      type: object
      required: [deviceId, deviceName, state, upgradableFirmwares]
      properties:
        deviceId:
          type: string
          description: 设备ID
        deviceName:
          type: string
          description: 设备名称
        state:
          type: boolean
          description: 设备在线状态
        space:
          $ref: '#/components/schemas/DeviceSpace'
          description: 设备关联的空间
        upgradableFirmwares:
          type: array
          description: 设备可升级固件列表
          items:
            $ref: '#/components/schemas/UpgradableFirmwareInfo'

            
    # ── Automation ────────────────────────────────────────────────
    AutomationDefinitionType:
      type: string
      enum: [SCRIPT_JSON]
      description: 自动化定义类型，当前仅支持 SCRIPT_JSON

    AutomationSummary:
      type: object
      required: [automationId, name, enabled, definitionType, createTime]
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        name:
          type: string
          description: 自动化名称。
        enabled:
          type: boolean
          description: 是否启用。true：启用；false：禁用。
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: |
            自动化类型，说明如下： <br />
            - SCRIPT_JSON：通过 API 创建的 Flow 自动化。  
            - SCRIPT_TEXT：通过 Aqara Studio Web 页面创建的 Flow 自动化。  
            - WHEN_IF_THEN：Classic 自动化。  
            - LEGACY_FLOW：Flow 自动化（旧版）。  
            - LEGACY_LINKAGE：Logic 自动化。  
            - OTHER：其他自动化类型。
        createTime:
          type: integer
          format: int64
          description: 创建时间（毫秒级 UTC 时间戳）
        manualTriggers:
          type: array
          nullable: true
          description: 仅包含可手动执行的触发器快捷信息，不代表完整触发器列表；完整规则以详情中的 config 为准。
          items:
            $ref: '#/components/schemas/AutomationManualTriggerBrief'
        space:
          allOf:
            - $ref: '#/components/schemas/SpaceNode'
          nullable: true
          description: 自动化当前关联的空间。若自动化未关联空间时，此值为 null。

    AutomationManualTriggerBrief:
      type: object
      required: [triggerNodeId, triggerName]
      properties:
        triggerNodeId:
          type: string
          description: 手动触发器 ID
        triggerName:
          type: string
          description: 手动触发器名称

    AutomationManualTriggerInfo:
      type: object
      required: [automationId, automationName, triggerNodeId, triggerName, enabled, definitionType, createTime]
      properties:
        automationId:
          type: string
          description: 自动化ID。
        automationName:
          type: string
          description: 自动化名称。
        triggerNodeId:
          type: string
          description: 手动触发节点ID。
        triggerName:
          type: string
          description: 手动触发名称。
        enabled:
          type: boolean
          description: |
            所属自动化是否启用。<br />
            true：启用；<br />
            false：禁用。
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: 自动化类型。
        createTime:
          type: integer
          format: int64
          description: 创建时间（毫秒时间戳）。
        space:
          allOf:
            - $ref: '#/components/schemas/SpaceNode'
          nullable: true
          description: 自动化当前关联的空间；仅 includeSpace 为 true 时返回，未关联空间时为 null。

    AutomationDetails:
      allOf:
        - $ref: '#/components/schemas/AutomationSummary'
        - type: object
          properties:
            configFormat:
              type: string
              nullable: true
              enum: [JSON_AUTOMATION, FLOW_CANONICAL]
              description: >-
                config 的实际持久化格式。SCRIPT_JSON 通常返回 JSON_AUTOMATION，SCRIPT_TEXT 通常返回
                FLOW_CANONICAL；其他自动化类型或无持久化定义时可以不返回该字段。
            config:
              nullable: true
              description: >-
                完整的实际持久化定义，必须结合 configFormat 解读；无持久化定义时可以不返回该字段。
                节点内部 config 等协议扩展字段保持原样返回，因此调用方应允许未知字段。
              anyOf:
                - $ref: '#/components/schemas/JsonAutomationConfig'
                - $ref: '#/components/schemas/FlowCanonicalConfig'

    JsonAutomationConfig:
      type: object
      required: [automations]
      description: OpenAPI 创建的 JSON 自动化定义。
      properties:
        metadata:
          $ref: '#/components/schemas/JsonAutomationMetadata'
        automations:
          type: array
          description: 自动化规则列表
          items:
            $ref: '#/components/schemas/JsonAutomationRule'

    JsonAutomationMetadata:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 配置内的自动化名称
        description:
          type: string
          nullable: true
          description: 配置说明
        scope:
          type: array
          description: 可被 data.ref 引用的设备属性定义
          items:
            $ref: '#/components/schemas/JsonAutomationDevicePropertyDefinition'

    JsonAutomationDevicePropertyDefinition:
      type: object
      required: [type, name, deviceId, endpointId, functionCode, traitCode]
      properties:
        type:
          type: string
          enum: [device.property]
        name:
          type: string
        deviceId:
          type: string
        endpointId:
          type: integer
        functionCode:
          type: string
        traitCode:
          type: string

    JsonAutomationRule:
      type: object
      required: [starters, actions]
      properties:
        name:
          type: string
          nullable: true
        starters:
          type: array
          description: 触发器列表；每项的 type 决定其余字段
          items:
            $ref: '#/components/schemas/JsonAutomationTypedItem'
        condition:
          allOf:
            - $ref: '#/components/schemas/JsonAutomationTypedItem'
          nullable: true
          description: >-
            动作执行前的可选条件，字段名为单数 condition。and/or 类型的组合条件在该对象内部使用 conditions 数组。
        actions:
          type: array
          description: 按顺序执行的动作列表；每项的 type 决定其余字段
          items:
            $ref: '#/components/schemas/JsonAutomationTypedItem'

    JsonAutomationTypedItem:
      type: object
      required: [type]
      description: >-
        JSON_AUTOMATION 的多态触发器、条件或动作。除 type 外的字段由具体类型决定，服务端会原样返回持久化内容。
      properties:
        type:
          type: string
          description: 例如 property.event、time.schedule、manual、property.state、and、or、not、time.between、device.trait.write、device.command.call、delay
      additionalProperties: true

    FlowCanonicalConfig:
      type: object
      description: Studio 前端画布使用的完整自动化定义。
      properties:
        kind:
          type: string
          enum: [flow.canonical]
        flowVersion:
          type: string
          description: 画布定义版本，当前实现默认值为 2.0
        registryVersion:
          type: string
          description: 节点注册表版本，当前实现默认值为 2.0
        metadata:
          $ref: '#/components/schemas/FlowCanonicalMetadata'
        variables:
          type: array
          description: 画布变量声明；不是触发器、条件或动作列表
          items:
            $ref: '#/components/schemas/FlowCanonicalVariable'
        nodes:
          type: array
          description: >-
            全部流程节点。通过 type 前缀识别语义：event.* 为触发器，condition.* 为条件，action.* 为动作；
            数组顺序不代表执行顺序。
          items:
            $ref: '#/components/schemas/FlowCanonicalNode'
        edges:
          type: array
          description: 节点端口之间的连线，是判断触发器、条件和动作执行关系的依据
          items:
            $ref: '#/components/schemas/FlowCanonicalEdge'
        editor:
          $ref: '#/components/schemas/FlowCanonicalEditorState'

    FlowCanonicalMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    FlowCanonicalVariable:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true

    FlowCanonicalNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: 节点ID，同时被 edges 和 editor 的映射引用
        type:
          type: string
          description: 节点类型；event.* 表示触发器，condition.* 表示条件，action.* 表示动作
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        config:
          type: object
          description: 节点类型专属配置，字段随 type 变化
          additionalProperties: true
        title:
          type: string
          nullable: true

    FlowCanonicalEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/FlowCanonicalPortRef'
        target:
          $ref: '#/components/schemas/FlowCanonicalPortRef'

    FlowCanonicalPortRef:
      type: object
      required: [node, port]
      properties:
        node:
          type: string
          description: FlowCanonicalNode.id
        port:
          type: string
          description: 节点输入或输出端口名

    FlowCanonicalEditorState:
      type: object
      description: 前端画布显示状态，不用于判断自动化执行顺序
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalPosition'
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalEditorNode'

    FlowCanonicalPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    FlowCanonicalEditorNode:
      type: object
      properties:
        summary:
          type: string
        description:
          type: string
        label:
          type: string
        icon:
          type: string
        iconColor:
          type: string
        detail:
          type: object
          additionalProperties: true
        hidden:
          type: boolean

    AutomationListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: 满足条件的自动化总数。
        pageNum:
          type: integer
          description: 当前页码。
        pageSize:
          type: integer
          description: 当前页大小。
        data:
          type: array
          description: 自动化列表。
     
          items:
            $ref: '#/components/schemas/AutomationSummary'

    CreateAutomationRequest:
      type: object
      required: [definitionType, config]
      properties:
        name:
          type: string
          description: 自动化名称
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误
        definitionType:
          $ref: '#/components/schemas/AutomationDefinitionType'
        config:
          type: object
          description: JSON 自动化脚本，详情请参考 [JSON 自动化脚本定义](https://docs.aqara.com/zh/docs/aqara-developer/data-export-api/reference/json-automation-script)。
          additionalProperties: true

    UpdateAutomationRequest:
      type: object
      required: [updateMask]
      properties:
        name:
          type: string
          description: 新名称。
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误。该字段不需要加入 updateMask。
        enabled:
          type: boolean
          description: 新启用状态。true：启用；false：禁用。
          nullable: true
        config:
          type: object
          description: 新配置。仅适用于 definitionType 为 SCRIPT_JSON 的自动化，其他类型自动化的配置不可编辑。
          nullable: true
          additionalProperties: true
        updateMask:
          type: array
          description: |
            需更新的参数名称列表，仅支持 name、enabled、config。   
            **注意**：name 和 enabled 适用于所有自动化。config 只适用于 definitionType 为 SCRIPT_JSON 的自动化。 
          items:
            type: string
            enum: [name, enabled, config]

    UpdateAutomationStatusRequest:
      type: object
      required: [automationIds, enabled]
      properties:
        automationIds:
          type: array
          description: 自动化 ID 列表。
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          description: 新启用状态。true：启用；false：禁用。

    UpdateAutomationSpaceRequest:
      type: object
      required: [spaceId, automationIds]
      properties:
        spaceId:
          type: string
          minLength: 1
          description: 目标空间ID。
        automationIds:
          type: array
          minItems: 1
          description: 待更新空间关联的自动化 ID 列表。
          items:
            type: string
      example:
        spaceId: "space-livingroom-001"
        automationIds: ["auto_01HXYZABCDEF1234567890"]

    DeleteAutomationsRequest:
      type: object
      required: [automationIds]
      properties:
        automationIds:
          type: array
          description: 自动化 ID 列表。
          minItems: 1
          items:
            type: string

    AutomationBatchFailure:
      type: object
      required: [automationId, code, message]
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        code:
          type: integer
          description: 错误码。
        message:
          type: string
          description: 错误信息。

    AutomationBatchResultData:
      type: object
      required: [successIds, failedItems]
      properties:
        successIds:
          type: array
          description: 成功的自动化 ID 列表。
          items:
            type: string
        failedItems:
          type: array
          description: 失败的自动化对象列表。
          items:
            $ref: '#/components/schemas/AutomationBatchFailure'

    CreateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: 自动化 ID。

    UpdateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true
              example: ""

    DeleteAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'

    QueryAutomationManualTriggerListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              description: 手动触发对象列表
              items:
                $ref: '#/components/schemas/AutomationManualTriggerInfo'

    ExecuteAutomationManualTriggerRequest:
      type: object
      required: [automationId, triggerNodeId]
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        triggerNodeId:
          type: string
          description: 要执行的手动触发器 ID。

    ExecuteAutomationManualTriggerResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'

    UpdateAutomationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'

    UpdateAutomationSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
      example:
        type: UpdateAutomationSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000026"
        code: 0
        message: success
        data:
          successIds: ["auto_01HXYZABCDEF1234567890"]
          failedItems: []

    AutomationDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationDetails'
              nullable: true

    AutomationListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationListData'

    AutomationCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationCapabilitiesData'
      example:
        type: QueryAutomationCapabilitiesResponse
        version: v1
        msgId: "52ebd835-1b8d-48f7-ab30-741d7c1ae0ee"
        code: 0
        message: success
