openapi: 3.0.3
info:
  title: Data Export API
  termsOfService: https://domain.com/terms
  x-internal: true
  description: |
    Data Export API 开放接口文档

    ## 公共请求头
    所有接口均需携带以下 Header 参数（由客户端统一附加）：
    | Header | 必填 | 说明 |
    |--------|------|------|
    | Authorization | 是 | `Bearer accessToken` |
    | Content-Type | 是 | `application/json` |
  version: v1

servers:
  - url: '{host}/open/api/v1'
    description: 数据转出 API 端点
    variables:
      host:
        description: |
          请输入您的 Aqara Studio 服务地址，可为本地局域网地址 (http) 或远程访问地址 (https)。
          例如：
          - http://10.11.50.56
          - https://xxx.edge-xxx.aqara.com/
        default: '<Aqara_Studio_URL>'

# 全局安全：所有接口均需 Bearer Token
security:
  - BearerAuth: []

tags:
  - name: Space
    description: 空间层级查询接口
  - name: Device
    description: 设备查询、属性读写与命令执行接口
  - name: Gateway
    description: 网关查询接口
  - name: Resource
    description: Studio ANode 白名单资源目录、查询、读取和安全修改接口。
  - name: Automation
    description: 自动化创建、编辑、查询、删除与能力查询接口
  - name: Firmware
    description: 固件查询与升级相关接口
  - name: History
    description: 设备点位值变化历史查询接口
  - name: Studio
    description: Studio 统计信息查询接口
  - name: EMS
    description: 能源管理接口（能耗趋势查询、能耗总量查询、能耗摘要查询）
  - name: Event
    description: 外部系统事件上报接口
  - name: Alarm
    description: 告警列表、确认与告警规则查询接口
  - name: Scene
    description: 独立场景创建、编辑、查询、空间关联、执行与删除接口

paths:

  # ────────────────────────────────────────────────────────────────
  # 查询空间列表
  # ────────────────────────────────────────────────────────────────

  /events:
    post:
      tags: [Event]
      summary: 上报外部系统事件
      description: 接收 Claude/Codex hook、CI 或监控告警等外部事件，并派发给自动化 `event.service_call` 触发块。
      operationId: reportExternalEvent
      x-idempotent: false
      x-retryable: false
      x-side-effects: event_dispatch
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalEventRequest'
            example:
              event: ci.build.completed
              source: github-actions
              payload:
                repository: aqara/example
                status: success
      responses:
        '200':
          description: 事件已接收并派发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /spaces:
    get:
      tags: [Space]
      summary: 查询空间列表
      description: 查询指定父空间下的所有子空间，可选包含父空间自身，满足灵活的空间层级查询需求。
      operationId: getSpaces
      x-skill-intent: space.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - name: parentSpaceId
          in: query
          description: 父空间 ID。为空时返回所有顶级空间（即没有父空间的空间，属于空间树的根节点）。
          required: false
          schema:
            type: string
        - name: needChildren
          in: query
          description: 是否查询父空间下的子空间。若 parentSpaceId 非空且 needChildren 为 false，则不返回子空间（仅在 needParentSpaceSelf 为 true 时可返回父空间自身）。
          required: false
          schema:
            type: boolean
            default: true
        - name: needParentSpaceSelf
          in: query
          description: 是否包含 parentSpaceId 对应的父空间自身。仅当 parentSpaceId 非空时生效。
          required: false
          schema:
            type: boolean
            default: false
        - name: includeMetadata
          in: query
          description: 是否包含空间元数据，默认false。
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Space]
      summary: 创建空间
      description: 创建一个空间。当 parentSpaceId 为空时创建顶级空间；不为空时，在该空间下创建子空间。
      operationId: createSpace
      x-skill-intent: space.create
      x-idempotent: false
      x-retryable: false
      x-side-effects: create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
            example:
              parentSpaceId: "space-home-001"
              name: "客厅"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # 修改空间名称
  # ────────────────────────────────────────────────────────────────
  /spaces/name:
    post:
      tags: [Space]
      summary: 修改空间名称
      description: 传入空间 ID，更新该空间的名称。
      operationId: updateSpaceName
      x-skill-intent: space.name.update
      x-idempotent: true
      x-retryable: true
      x-side-effects: update
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceNameRequest'
            example:
              spaceId: "space-livingroom-001"
              name: "新客厅"
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSpaceNameResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # 删除空间
  /spaces/delete:
    post:
      tags: [Space]
      summary: 删除空间
      description: 根据空间 ID 删除空间，可选择是否删除子空间。
      operationId: deleteSpace
      x-skill-intent: space.delete
      x-idempotent: true
      x-retryable: true
      x-side-effects: delete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSpaceRequest'
            example:
              spaceId: "space-livingroom-001"
              deleteChildren: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # 查询DeviceType集合
  # ────────────────────────────────────────────────────────────────
  /devices/types:
    get:
      tags: [Device]
      summary: 查询设备类型（DeviceType）列表
      description: 获取 Aqara Studio 现有的所有设备类型（DeviceType）。
      operationId: getDeviceTypes
      x-skill-intent: device.type.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters: []
      responses:
        '200':
          description: 请求发起成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # 获取设备筛选选项
  # ────────────────────────────────────────────────────────────────
  /devices/filter-options:
    get:
      tags: [Device]
      summary: 获取设备筛选选项
      description: |-
        返回当前已创建且调用方可见的协议实例，可用于 /devices 的筛选条件。
        默认返回全部已支持选项类别；当前仅支持 protocols。可通过 fields 指定需要的类别，未请求类别不返回；没有可选实例时返回空数组。
        本地调用可返回离线或没有设备的实例；启用设备授权的云端调用仅返回可访问设备所属的实例。搜索黑名单网络和云端转出网络不作为筛选选项返回。
        未配置公开类型或位掩码的实例仍返回 id、name，对应的 type、networkProtocolMask 显式为 null；不会返回内部框架类型。
        本接口支持本地和云端 HTTP。仅返回选项，不统计设备数量，不随其他设备筛选条件联动；不提供 WebSocket/MCP 选项查询入口。
      operationId: getDeviceFilterOptions
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - name: fields
          required: false
          style: form
          explode: true
          description: 缺省返回全部已支持类别，当前仅 protocols。支持重复参数或逗号分隔，去除首尾空白并去重。显式空值、空片段或未知类别返回 400；例如 fields=protocols, 或 fields=deviceTypes 均无效。
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum:
                - protocols
          example:
            - protocols
          in: query
      responses:
        '200':
          description: 成功；无可用实例时 data.protocols 为 []。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFilterOptionsResponse'
              example:
                type: DeviceFilterOptionsResponse
                version: v1
                msgId: device-filter-options-001
                code: 0
                message: success
                data:
                  protocols:
                    - id: '1001'
                      name: Home Assistant
                      type: homeassistant
                      networkProtocolMask: null
                    - id: '1002'
                      name: Home Assistant(1)
                      type: homeassistant
                      networkProtocolMask: null
                    - id: '1003'
                      name: Matter
                      type: matter
                      networkProtocolMask: 2
                    - id: '1004'
                      name: Zigbee
                      type: zigbee
                      networkProtocolMask: 8
                    - id: '1005'
                      name: Aqara RS485
                      type: aqarars485
                      networkProtocolMask: 32
                    - id: '1006'
                      name: Custom protocol
                      type: null
                      networkProtocolMask: null
        '400':
          description: fields 为空、含空片段或包含未知类别。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 协议类型映射配置无效或发生内部错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /devices:
    get:
      tags: [Device]
      summary: 查询设备信息列表
      description: |
        分页查询设备信息，并支持按空间、在线状态、所属网关、设备类型和设备名称过滤。
        支持按协议实例 ID、实例名称、公开协议类型和网络协议分类位掩码筛选。
        同一列表内多值取 OR，掩码的多个位取 OR；不同筛选条件及原有查询条件之间取 AND。先过滤，再统计 totalCount、排序和分页。
        不传筛选条件保持原行为；三个列表为空时不限制，未知值不匹配。protocolNames 完整匹配且区分大小写，Home Assistant 不匹配 Home Assistant(1)。
        可先调用 /devices/filter-options 获取当前可选实例；显示使用 name，长期保存或指定实例推荐使用稳定的 id。协议类型由服务端配置，不要求所有实例都有 type 或 networkProtocolMask。
        networkProtocolMask 按实例所属类型的配置分类筛选，不读取设备实时 NetworkProtocolSupport Trait。省略不限制；0 或无匹配返回空结果。
        每台设备按可用信息返回 protocolId 和 networkProtocolMask：前者为所属协议实例 ID，后者为该实例类型的完整配置掩码（不裁剪为查询命中的位）。无所属实例时省略两个字段；有实例但未配置掩码时只返回 protocolId。普通查询或仅按实例 ID/名称查询时，映射配置无效只会省略响应掩码；类型或非零掩码筛选仍要求有效配置。
        `gatewayId` 不传、传空字符串或仅包含空白字符时不参与过滤；传入非空值时，会去除首尾空白并按所属网关 ID 精确匹配。网关过滤会与其他查询条件同时生效，并在分页前执行。
      operationId: getDevices
      x-skill-intent: device.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - name: protocolIds
          required: false
          style: form
          explode: true
          description: '协议实例 ID，来自 /devices/filter-options 的 protocols[].id；兼容 id: 前缀。支持重复参数或逗号分隔，去除首尾空白；多个值取 OR。'
          schema:
            type: array
            items:
              type: string
          example:
            - '1001'
            - '1002'
          in: query
        - name: protocolNames
          required: false
          style: form
          explode: true
          description: 协议实例显示名称，区分大小写、完整匹配，保留逗号和首尾空格。仅支持重复参数，不按逗号拆分；多个值取 OR。重命名后旧名称不再匹配。
          schema:
            type: array
            items:
              type: string
          example:
            - Home Assistant
            - Home Assistant(1)
          in: query
        - name: protocolTypes
          required: false
          style: form
          explode: true
          description: 公开协议类型代码，匹配该类型的所有实例。去除首尾空白并忽略大小写，支持重复参数或逗号分隔；多个值取 OR，未知代码不匹配。默认包括 homeassistant、matter、zigbee、aqarahub、modbus、bacnet、knx、virtual、aqarars485；实际以服务端配置和选项响应为准。
          schema:
            type: array
            items:
              type: string
          example:
            - matter
            - zigbee
          in: query
        - name: networkProtocolMask
          required: false
          allowEmptyValue: true
          description: 单个十进制 Uint32 分类掩码，任意位匹配，与其他条件取 AND。省略不限制；0 或无匹配返回空结果。沿用 NetworkProtocolSupport（traitId=20870）：Wi-Fi=1、Thread=2、Ethernet=4、Zigbee=8、BLE=16、Aqara RS485=32。默认配置关联 Matter→Thread(2)、Zigbee→8、Aqara RS485→32；Thread 或 Zigbee 传 10。匹配服务端配置分类，不代表设备实时支持情况。单个空值（networkProtocolMask=）或仅含空白时忽略该条件，其他筛选条件仍生效；非空值只接受单个十进制整数文本。重复参数（即使包含空值）、小数、科学计数法、负数或超出 4294967295 返回 400。
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
          example: 10
          in: query
        - name: spaceIds
          in: query
          description: 空间 ID 列表。示例：spaceIds=xx1,xx2 或 spaceIds=xx1&spaceIds=xx2。为空查询所有设备。
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: needChildren
          in: query
          description: "是否查询子空间内的设备。仅在 `spaceIds` 有值时生效。"
          required: false
          schema:
            type: boolean
            default: false
        - name: spaceAssociated
          in: query
          description: "是否查询 `spaceIds` 指定空间下的设备。<ul><li>true：仅查询指定空间下的设备；</li><li>false：仅查询非指定空间下的设备（此时 `spaceIds` 和 `needChildren` 参数无效）；</li><li>不填：<ul><li>当 `spaceIds` 为空时，默认查询所有设备；</li><li>当 `spaceIds` 不为空时，默认查询指定空间下的设备。</li></ul></li></ul>"
          required: false
          schema:
            type: boolean
            nullable: true
        - name: state
          in: query
          description: 设备在线状态。<ul><li>true：查询在线设备。</li><li>false：查询离线设备。</li><li>不填：不筛选。</li></ul>
          required: false
          schema:
            type: boolean
            nullable: true
        - name: gatewayId
          in: query
          description: 所属网关 ID。不传、为空字符串或仅包含空白字符时不参与过滤；有值时去除首尾空白后精确匹配。
          required: false
          schema:
            type: string
          example: gateway-001
        - name: deviceTypesList
          in: query
          description: 设备类型列表。示例：deviceTypesList=light,switch 或 deviceTypesList=light&deviceTypesList=switch
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: deviceTypesMatchMode
          in: query
          description: "`deviceTypesList` 内多个设备类型的匹配方式；`or` 表示命中任意一个类型，`and` 表示必须同时命中全部类型"
          required: false
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: deviceName
          in: query
          description: 设备名称模糊匹配（不区分大小写，空白值自动忽略）
          required: false
          schema:
            type: string
        - name: orderBy
          in: query
          description: "排序方式。<ul><li>`createTime asc`：按创建时间升序排序。</li><li>`createTime desc`：按创建时间降序排序。</li></ul>"
          required: false
          schema:
            type: string
            default: createTime asc
            enum: [createTime asc, createTime desc]
          example: createTime asc
        - name: pageNum
          in: query
          description: 页码
          required: false
          schema:
            type: integer
          example: 1
        - name: pageSize
          in: query
          description: 每页数量。
          required: false
          schema:
            type: integer
          example: 200
      responses:
        '200':
          description: 请求发起成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'
              examples:
                devicesPage:
                  value:
                    type: GetDeviceInfoResponse
                    version: v1
                    msgId: "1751609244328"
                    code: 0
                    message: success
                    data:
                      totalCount: 2
                      pageNum: 1
                      pageSize: 200
                      data:
                        - deviceId: "device-001"
                          gatewayId: "gateway-001"
                          protocolId: "1004"
                          networkProtocolMask: 8
                          deviceName: "客厅灯"
                          deviceTypesList: ["light"]
                          createTime: 1710001234567
                          state: true
                          space:
                            parentSpaceId: "space-home-001"
                            spaceId: "space-room-001"
                            name: "客厅"
                        - deviceId: "device-002"
                          gatewayId: "gateway-001"
                          protocolId: "1001"
                          deviceName: "客厅开关"
                          deviceTypesList: ["switch"]
                          createTime: 1710002345678
                          state: true
                          space:
                            parentSpaceId: "space-home-001"
                            spaceId: "space-room-001"
                            name: "客厅"
        '400':
          description: 查询参数错误；networkProtocolMask 重复（即使包含空值）、非空且非十进制整数或超出 Uint32 范围时返回此错误。单个空值或仅含空白时忽略该条件。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          description: 需要读取协议映射（指定非空 protocolTypes 或非零 networkProtocolMask）时，映射配置无效返回 500；其他内部错误也可能返回 500。networkProtocolMask=0 时直接返回成功的空结果，即使指定了 protocolTypes，也跳过协议映射读取和校验，不会因映射配置无效返回 500。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # 查询设备定义（设备详细信息）
  # ────────────────────────────────────────────────────────────────
  /devices/definitions:
    get:
      tags: [Device]
      summary: 查询设备定义（设备详细信息）
      description: |
        查询设备定义（设备详细信息）。包括设备类型（deviceType）、端点列表（endpoints）、属性列表（properties）等。

        gatewayId 说明：
        - gatewayId == deviceId 表示这个设备自身是网关
        - gatewayId == null 或 gatewayId 是空字符串表示这个设备是不带子设备的直连网关或第三方接入设备
      operationId: getDeviceDefinitions
      x-skill-intent: device.definition.get
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - name: deviceIds
          in: query
          required: true
          description: 设备 ID 列表，最多 200 个。URL 示例：deviceIds=xx1,xx2 或 deviceIds=xx1&deviceIds=xx2
          schema:
            type: array
            maxItems: 200
            items:
              type: string
          style: form
          explode: true
        - name: displayTags
          in: query
          required: false
          description: 设备标签列表。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: displayTagsMatchMode
          in: query
          description: "`displayTags` 内多个标签的匹配方式；`or` 表示命中任意一个标签，`and` 表示必须同时命中全部标签"
          required: false
          schema:
            type: string
            enum:
            - or
            - and
            default: or
        - name: includeMetadata
          in: query
          required: false
          description: 是否包含设备元数据，默认为 false。
          schema:
            type: boolean
            default: false
        - name: includeCapabilities
          in: query
          required: false
          description: 是否包含设备能力，默认为 false。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 请求发起成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDefinitionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # 查询设备匹配能力
  # ────────────────────────────────────────────────────────────────
  /devices/capabilities:
    get:
      tags: [Device]
      summary: 查询设备匹配能力
      description: |
        查询单个设备中符合过滤条件的能力配置，只返回命中的定义与对应 trait 当前值，不返回设备全量定义。

        :::tip   
        - `functionCodes`、`traitCodes`、`commandCodes` 之间按 AND 关系组合；如需查询 trait 或 command 任一类能力，请分开请求，或按 `functionCodes` 查询完整 function 定义。
        - 只传 `functionCodes`，不传 `traitCodes` 或 `commandCodes` 时：返回该 Function 下所有完整的 Trait 和 Command 定义（即全部叶子节点）。
        - 传入 traitCodes 或 commandCodes 时：只返回匹配这些条件的 Trait 或 Command 叶子，未匹配的叶子不返回。command 没有当前值。
        - 设备存在但能力未命中时，返回设备基础信息且 `endpoints=[]`；设备不存在或不可访问时，`data=null`。
        :::

      operationId: getMatchedDeviceCapabilities
      x-skill-intent: device.capability.match
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - name: deviceId
          in: query
          required: true
          description: 设备 ID（did）。
          schema:
            type: string
        - name: deviceTypesList
          in: query
          required: false
          description: |
            设备类型列表。用于先校验设备整体类型，再裁剪匹配 endpoint 类型。

            :::tip
            `deviceTypesList` 不能单独作为能力过滤条件。
            :::

          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: deviceTypesMatchMode
          in: query
          required: false
          description: |
            `deviceTypesList` 内多个设备类型的匹配方式。
            `or`：设备命中任意一个类型。
            `and`：设备必须同时命中全部类型。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: functionCodes
          in: query
          required: false
          description: |
            functionCode 列表。
            与 `traitCodes`、`commandCodes` 至少传一个。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: functionCodesMatchMode
          in: query
          required: false
          description: |
            `functionCodes` 内多个值的匹配方式。
            `or`：命中任意一个。
            `and`：裁剪后的结果必须包含全部值。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: traitCodes
          in: query
          required: false
          description: |
            traitCode 列表
            与 `functionCodes`、`commandCodes` 至少传一个。
            trait 命中时返回定义、当前值 value 与更新时间 time
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: traitCodesMatchMode
          in: query
          required: false
          description: |
            traitCodes 内多个值的匹配方式。
            `and` 表示必须在同一个 function 内同时命中全部 trait。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: commandCodes
          in: query
          required: false
          description: |
            commandCode 列表。
            与 `traitCodes`、`functionCodes` 至少传一个。
            command 只返回命令定义和字段定义，没有当前值。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: commandCodesMatchMode
          in: query
          required: false
          description: |
            commandCodes 内多个值的匹配方式。
            `and`：必须在同一个 function 内同时命中全部 command。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: displayTags
          in: query
          required: false
          description: 设备标签列表。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: displayTagsMatchMode
          in: query
          required: false
          description: "`displayTags` 内多个标签的匹配方式；`or` 表示命中任意一个标签，`and` 表示必须同时命中全部标签"
          schema:
            type: string
            enum:
            - or
            - and
            default: or
      responses:
        '200':
          description: 接口请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMatchedDeviceCapabilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # 按能力筛选查询设备
  /devices/capabilities/find:
    get:
      tags: [Device]
      summary: 按能力筛选查询设备
      description: |
        按空间、设备类型、functionCode、traitCode 等条件筛选设备；查询参数支持逗号分隔或重复传参。
        不传 pageNum/pageSize 时返回第 1 页最多 100 条；显式分页时 pageSize 默认 50、最大 200。
        响应 hasMore=true 表示仍有后续数据，调用方应递增 pageNum 继续查询。
      operationId: findDevicesByCapabilityByQuery
      x-skill-intent: device.capability.find
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
      - name: spaceIds
        in: query
        required: false
        description: 空间 ID 列表。
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: needChildren
        in: query
        required: false
        description: 是否查询 `spaceIds` 的子空间内的设备。
        schema:
          type: boolean
          default: false
      - name: spaceAssociated
        in: query
        required: false
        description: 是否查询 `spaceIds` 指定空间下的设备。
        schema:
          type: boolean
      - name: deviceTypesList
        in: query
        required: false
        description: 设备类型列表。
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: deviceType
        in: query
        required: false
        description: 设备类型。
        schema:
          type: string
      - name: functionCodes
        in: query
        required: false
        description: functionCode （功能代码）列表。
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: functionCode
        in: query
        required: false
        description: functionCode（功能代码）。
        schema:
          type: string
      - name: traitCodes
        in: query
        required: false
        description: traitCode（功能点代码）列表。
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: traitCode
        in: query
        required: false
        description: traitCode（功能点代码）。
        schema:
          type: string
      - name: includeAllSpec
        in: query
        required: false
        description: 是否查询出设备全部的 spec 功能。
        schema:
          type: boolean
          default: false
      - name: pageNum
        in: query
        required: false
        description: 页码，从 1 开始；与 pageSize 均不传时使用兼容模式返回前 100 条。
        schema:
          type: integer
          minimum: 1
      - name: pageSize
        in: query
        required: false
        description: 每页数量；显式分页时默认 50，最大 200。
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: displayTags
        in: query
        required: false
        description: 设备标签列表。
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: displayTagsMatchMode
        in: query
        required: false
        description: "`displayTags` 内多个标签的匹配方式；`or` 表示命中任意一个标签，`and` 表示必须同时命中全部标签"
        schema:
          type: string
          enum:
          - or
          - and
          default: or
      - name: capabilities
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          nullable: true
          description: 设备级扩展能力代码，例如 sequence、lightbox；多个值使用 AND 语义。
        style: form
        explode: true
      - name: includeCapabilities
        in: query
        required: false
        schema:
          type: boolean
          default: false
          description: 是否在设备定义中返回设备级 capabilities 代码。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindDevicesByCapabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
