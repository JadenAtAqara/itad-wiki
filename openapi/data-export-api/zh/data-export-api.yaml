  /actions/{command}:
    post:
      tags: [Resource]
      summary: 执行资源命令
      description: "对资源执行其类型定义中声明的命令。请求体只允许 `id` 和 `input`：id 必须是非空字符串，input 必须是对象，额外字段会被拒绝。\n具体输入、输出及可用命令以 GET /resource-types/{type} 返回的运行时定义为准。\n协议资源常用命令：create 的 id 为 `protocol:{protocolId}`；创建 network 时不要传 parentId，创建 device/point 时 parentId 必填；\ndiscover 的 id 为 `protocol:{protocolId}`；import 的 id 为发现任务资源 ID；delete 的 id 为待删除资源 ID，input 必须为空对象。\n\n\nimport：导入 ownerId 必须与发现时服务端记录的 owner 指向同一运行实例；同协议、同类型的其他 owner 仍被拒绝。协议、ownerKind、targetKind 也须一致，候选须属于该 job。缺少完整服务端上下文的旧任务重新发现，不能用客户端参数补足。检查在整批创建前完成。 不一致返回 PROTOCOL_CONFIG_INVALID（2103，HTTP 422）；已定位协议的任务缺少 owner/目标上下文时返回 DISCOVERY_JOB_NOT_FOUND（2111，HTTP 400）；任务或协议关联不可定位时返回 RESOURCE_NOT_FOUND（2121，HTTP 404），均不创建对象。\n\nsequence 资源 create 的 id 为 `sequence`；input 允许 `name`、`data`、`icon`、`deviceId`，其中 `name`、`data`、`deviceId` 必填。\n`deviceId` 标识该情景创建所针对的设备。create 只接受 `data.type=commands`，不接受 unavailable。"
      operationId: executeResourceAction
      x-idempotent: false
      x-retryable: false
      x-side-effects: command_execute
      parameters:
        - name: command
          in: path
          required: true
          description: 资源类型定义返回的命令名称。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
            examples:
              modbusNetwork:
                summary: 创建 Modbus 网络
                description: 不传 parentId。保存 data.id 为 modbusNetworkResourceId；TCP 地址属于设备配置，不是网络的 transport/host/port。
                value:
                  id: protocol:modbus
                  input:
                    entityKind: network
                    name: Modbus TCP 网络
                    config:
                      enabled: true
                      floatByteOrder: orderABCD
                      longByteOrder: orderABCD
              modbusDevice:
                summary: 创建 Modbus TCP 设备
                description: 替换为 Studio 可达的设备地址。保存 data.id 为 modbusDeviceResourceId；deviceAddress 是协议地址，不是资源 ID。
                value:
                  id: protocol:modbus
                  input:
                    entityKind: device
                    parentId: '{{modbusNetworkResourceId}}'
                    name: PLC-1
                    config:
                      ipAddress: 192.0.2.10
                      port: 502
                      deviceAddress: 1
                      frameMode: modbusTcp
                      enabled: true
              modbusPoint:
                summary: 创建 Modbus 保持寄存器点
                description: 保存 data.id 为 modbusPointResourceId。带 / 的键是完整字段名；address 为字符串。此请求创建基础协议点，不代表完成显式业务 Spec 和转换映射。
                value:
                  id: protocol:modbus
                  input:
                    entityKind: point
                    parentId: '{{modbusDeviceResourceId}}'
                    name: 寄存器 40011
                    config:
                      friendlyName: 寄存器 40011
                      pollFrequency: normal
                      modbusDiscoverySpecInfo/registerType: holdingRegister
                      modbusDiscoverySpecInfo/readWriteType: readOnly
                      modbusDiscoverySpecInfo/addressFormat: modbus
                      modbusDiscoverySpecInfo/address: '40011'
                      modbusDiscoverySpecInfo/dataType: integerType
              deleteProtocolEntity:
                summary: 删除协议实例
                description: 仅对最新回读中 commands 含 delete 的实例发送；可将 id 替换为目标网络或设备 ID。当前实例 unavailableCommands 说明被拒原因，执行时仍会重新校验权限和状态。
                value:
                  id: '{{modbusPointResourceId}}'
                  input: {}
              bacnetNetwork:
                summary: 创建 BACnet 网络
                description: 选择现场不冲突的本地实例号、UDP 端口；保存 data.id 为 bacnetNetworkResourceId。绑定地址等额外字段以网络 config schema 为准，也可以复用已有网络。
                value:
                  id: protocol:bacnet
                  input:
                    entityKind: network
                    name: BACnet 网络
                    config:
                      localDevice/objectInstanceNumber: 123456
                      bacnetComm/network/ipPort/link/udpPort: 47808
                      enabled: true
              bacnetDiscoverDevice:
                summary: 在网络发现 BACnet 设备
                description: 要求 deviceDiscovery=true。保存 data.id 为 deviceJobId；options={} 使用默认参数，不能假设任意协议支持同样的扫描参数。
                value:
                  id: protocol:bacnet
                  input:
                    ownerKind: network
                    ownerId: '{{bacnetNetworkResourceId}}'
                    targetKind: device
                    options: {}
              bacnetImportDevice:
                summary: 导入选中的 BACnet 设备
                description: 设备实例 ID 从 data.results[].created.instanceId 取得，保存为 bacnetDeviceResourceId。批量最多 200 个候选；逐项检查 results，保留成功项，不因部分失败重建全部对象。
                value:
                  id: '{{deviceJobId}}'
                  input:
                    ownerId: '{{bacnetNetworkResourceId}}'
                    discoveryObjectIds:
                    - '{{deviceCandidateId}}'
              bacnetDiscoverPoint:
                summary: 在设备发现 BACnet 点
                description: 要求 pointDiscovery=true。保存 data.id 为 pointJobId，沿用任务轮询规则，不能直接导入仍在 running 的任务。
                value:
                  id: protocol:bacnet
                  input:
                    ownerKind: device
                    ownerId: '{{bacnetDeviceResourceId}}'
                    targetKind: point
                    options: {}
              bacnetImportPoint:
                summary: 导入选中的 BACnet 点
                description: 从 data.results[].created.instanceId 保存 bacnetPointResourceId。input 只接受 ownerId/discoveryObjectIds；不接受 pointConfigs、targetProperty
                  或 conversion。
                value:
                  id: '{{pointJobId}}'
                  input:
                    ownerId: '{{bacnetDeviceResourceId}}'
                    discoveryObjectIds:
                    - '{{pointCandidateId}}'
              haNetwork:
                summary: 创建 Home Assistant 网络
                description: 替换可达地址和 HA 长期访问令牌；保存 data.id 为 haNetworkResourceId。令牌是敏感写入字段，不会出现在 properties 回读中。
                value:
                  id: protocol:homeAssistantBridge
