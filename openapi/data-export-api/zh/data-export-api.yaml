      description: 根据全局唯一资源 ID 自动识别资源类型。协议资源返回 properties、schema 和只读 health；properties 不包含 token、password、secret、credential、privateKey、apiKey
        等敏感字段。 协议目录、网络、设备和点返回 protocolId；读取、修改仅用 id。业务 deviceId 和 controlReference 按设备可见性、授权和映射确认返回，发现任务上下文见 Resource 场景指南。
