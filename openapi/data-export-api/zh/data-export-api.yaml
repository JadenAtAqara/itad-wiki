                    color: '#FF6600'
                    brightness: 80
                    transitionTime: 1.0
        sequenceAssign:
          summary: 将情景分配到设备
          description: 始终绑定最新版本，只接受 deviceId；传 revision（包括 null）会被拒绝。随后带 deviceId 查询，等待 assignment.syncState=SYNCED 且
            syncedRevision=revision 后再启动。
          method: POST
          path: /actions/assign
          request:
            headers: 公共请求头
            query: null
            body:
              id: '{{sequenceId}}'
              input:
                deviceId: '{{businessDeviceId}}'
        sequenceStart:
          summary: 启动已同步情景
          description: 沿用绑定设备 ID。系统预设直接使用设备查询返回的 ID 加同一 deviceId 启动，不保证能脱离设备单独读取。
          method: POST
          path: /actions/start
          request:
            headers: 公共请求头
            query: null
            body:
              id: '{{sequenceId}}'
              input:
                deviceId: '{{businessDeviceId}}'
        sequenceStop:
          summary: 停止设备当前情景
          description: 固定目标 id=sequence，不使用具体 sequenceId。
          method: POST
          path: /actions/stop
          request:
            headers: 公共请求头
            query: null
            body:
              id: sequence
              input:
                deviceId: '{{businessDeviceId}}'
        sequencePreview:
          summary: 在设备临时预览情景
          description: 固定目标 id=sequence；data 按目标设备 spec 构造，不创建持久情景或绑定。
          method: POST
          path: /actions/preview
          request:
            headers: 公共请求头
            query: null
            body:
              id: sequence
              input:
                deviceId: '{{businessDeviceId}}'
                data:
                  type: commands
                  loopCount: 1
                  completionAction: HOLD
                  commands:
                  - command: setColor
                    color: '#FF6600'
                    brightness: 80
                    transitionTime: 1.0
        sequenceRetry:
          summary: 重新排队失败的同步任务
          description: 仅用于真实绑定 syncState=FAILED；成功表示重新进入队列，不表示同步已完成，继续按设备查询。
          method: POST
          path: /actions/retry
          request:
            headers: 公共请求头
            query: null
            body:
              id: '{{sequenceId}}'
              input:
                deviceId: '{{businessDeviceId}}'
        sequenceUnassign:
          summary: 请求解除设备绑定
          description: 异步解除，按设备查询直到 Relation 消失。最后一个绑定删除后，服务可能自动删除用户情景；不要固定串行调用 delete。
          method: POST
          path: /actions/unassign
          request:
            headers: 公共请求头
            query: null
            body:
              id: '{{sequenceId}}'
              input:
                deviceId: '{{businessDeviceId}}'
        sequenceDelete:
          summary: 删除没有绑定的用户情景
          description: 只用于当前没有任何 Relation 的用户配置，并以最新回读 commands 为准；系统预设不可删除。
          method: POST
          path: /actions/delete
          request:
            headers: 公共请求头
            query: null
            body:
              id: '{{sequenceId}}'
              input: {}

