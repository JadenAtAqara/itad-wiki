                    options: {}
              createBackup:
                summary: 创建本地系统备份
                description: remark 最长 20 字符；保存 data.id 为 backupJobId，响应是异步 job，不是备份记录 ID。
                value:
                  id: backup
                  input:
                    remark: 维护前备份
              restoreBackup:
                summary: 恢复选中的系统备份
                description: 此请求会恢复系统数据，只在需要恢复时单独执行，不属于创建备份后的固定下一步。保存返回的 job ID 并轮询；input 必须为空对象。
                value:
                  id: '{{backupId}}'
                  input: {}
              deleteBackup:
                summary: 删除选中的备份文件
                description: 此请求删除指定本地备份，只在需要清理时执行；input 必须为空对象。
                value:
                  id: '{{backupId}}'
                  input: {}
              sequenceCreate:
                summary: 创建晚霞情景
                description: 当前 create 必须传 deviceId，用于设备名称约束校验；创建不等于设备绑定。保存 data.id 为 sequenceId，随后 assign。色彩命令示例要求设备 spec 支持。
                value:
                  id: sequence
                  input:
                    name: 晚霞
                    deviceId: '{{businessDeviceId}}'
                    data:
                      type: commands
                      loopCount: 1
                      completionAction: HOLD
                      commands:
                      - command: setColor
                        color: '#FF6600'
                        brightness: 80
                        transitionTime: 1.0
              sequenceAssign:
                summary: 将情景分配到设备
                description: 始终绑定最新版本，只接受 deviceId；传 revision（包括 null）会被拒绝。随后带 deviceId 查询，等待 assignment.syncState=SYNCED 且
                  syncedRevision=revision 后再启动。
                value:
                  id: '{{sequenceId}}'
                  input:
                    deviceId: '{{businessDeviceId}}'
              sequenceStart:
                summary: 启动已同步情景
                description: 沿用绑定设备 ID。系统预设直接使用设备查询返回的 ID 加同一 deviceId 启动，不保证能脱离设备单独读取。
                value:
                  id: '{{sequenceId}}'
                  input:
                    deviceId: '{{businessDeviceId}}'
              sequenceStop:
                summary: 停止设备当前情景
                description: 固定目标 id=sequence，不使用具体 sequenceId。
                value:
                  id: sequence
                  input:
                    deviceId: '{{businessDeviceId}}'
              sequencePreview:
                summary: 在设备临时预览情景
                description: 固定目标 id=sequence；data 按目标设备 spec 构造，不创建持久情景或绑定。
                value:
                  id: sequence
                  input:
                    deviceId: '{{businessDeviceId}}'
                    data:
                      type: commands
                      loopCount: 1
                      completionAction: HOLD
                      commands:
                      - command: setColor
                        color: '#FF6600'
                        brightness: 80
                        transitionTime: 1.0
              sequenceRetry:
                summary: 重新排队失败的同步任务
                description: 仅用于真实绑定 syncState=FAILED；成功表示重新进入队列，不表示同步已完成，继续按设备查询。
                value:
                  id: '{{sequenceId}}'
                  input:
                    deviceId: '{{businessDeviceId}}'
              sequenceUnassign:
                summary: 请求解除设备绑定
                description: 异步解除，按设备查询直到 Relation 消失。最后一个绑定删除后，服务可能自动删除用户情景；不要固定串行调用 delete。
                value:
                  id: '{{sequenceId}}'
                  input:
                    deviceId: '{{businessDeviceId}}'
              sequenceDelete:
                summary: 删除没有绑定的用户情景
                description: 只用于当前没有任何 Relation 的用户配置，并以最新回读 commands 为准；系统预设不可删除。
                value:
                  id: '{{sequenceId}}'
                  input: {}
              importDifferentOwnerRejected:
                summary: 反例：同协议的其他设备不能接收当前任务候选
                description: pointJobId 在 bacnetDeviceResourceId 上发现；另一个 owner 即使属于相同协议和设备类型也拒绝，整批不创建。
                value:
                  id: '{{pointJobId}}'
                  input:
                    ownerId: '{{anotherBacnetDeviceResourceId}}'
                    discoveryObjectIds:
                    - '{{pointCandidateId}}'
              createSequence:
                summary: POST /actions/create 创建情景
                value:
                  id: sequence
                  input:
                    name: 晚霞
                    deviceId: '{{businessDeviceId}}'
                    icon: ''
                    data:
                      type: commands
                      loopCount: 1
                      completionAction: HOLD
                      commands:
                      - command: setColor
                        color: '#FF6600'
                        brightness: 80
                        transitionTime: 1.0
