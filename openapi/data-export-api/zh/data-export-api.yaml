          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
      x-request-examples:
        readProtocol:
          summary: 读取 Modbus 协议能力
          description: "检查 manualNetworkAdd、manualDeviceAdd、manualPointAdd、deviceDiscovery、pointDiscovery；Modbus 点发现当前不支持。响应返回独立 protocolId，后续查询或专用点工具使用该值。"
          method: GET
