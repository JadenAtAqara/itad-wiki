          description: 设备 ID
        gatewayId:
          type: string
          nullable: true
          description: |
            此设备所绑定的网关 ID。
            如果 `gatewayId` 等于 `deviceId`，表示这个设备自身是网关。
            如果 `gatewayId` 为 `null` 或空字符串，表示这个设备是不带子设备的直连网关或第三方接入设备。
        name:
          type: string
          description: 设备名称
        deviceTypesList:
          type: array
