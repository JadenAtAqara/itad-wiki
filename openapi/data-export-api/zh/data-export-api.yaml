                summary: 创建 KNX 网络
                description: localIp=0.0.0.0 使用自动地址；保存 data.id 为 knxNetworkResourceId，也可填 Studio 实际网卡地址。
                value:
                  id: protocol:knxClient
                  input:
                    entityKind: network
                    name: KNX 网络
                    config:
                      localIp: 0.0.0.0
                      enabled: true
