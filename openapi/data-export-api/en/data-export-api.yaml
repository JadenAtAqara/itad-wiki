    # ── Device Bind Result ────────────────────────────────────────
    GatewaySubdeviceDidFilter:
      type: object
      required: [gatewayId]
      properties:
        gatewayId:
          type: string
          description: Gateway ID
        subDeviceIds:
          type: array
          nullable: true
          description: |
            List of subdevice IDs.
            - If empty or omitted: Query all subdevices under the specified gateway.
            - If not empty: Query the specified subdevices under the specified gateway.
          items:
            type: string

    DeviceBindResultRequest:
      type: object
      required: [gatewaySubdeviceFilters]
      properties:
        protocols:
          type: array
          nullable: true
          description: Specifies the protocol types of subdevices to query. If not provided, there is no restriction on protocol types.
          items:
            type: string
            enum: [zigbee, matter]
        gatewaySubdeviceFilters:
          type: array
          description: Filters (Gateway ID and Subdevice ID)
          required: true
          items:
            $ref: '#/components/schemas/GatewaySubdeviceDidFilter'

    DeviceBindResultItem:
      type: object
      required: [deviceId, protocols, gatewayId, bindTime]
      properties:
        deviceId:
          type: string
          description: Sub-device ID
        deviceName:
          type: string
          nullable: true
          description: Sub-device name
        space:
          $ref: '#/components/schemas/DeviceSpace'
          nullable: true
          description: Space where the sub-device is located
        protocols:
          type: array
          items:
            type: string
            enum: [zigbee, matter]
          description: List of supported protocols
        gatewayId:
          type: string
          description: Associated gateway ID
        code:
          type: integer
          nullable: true
          description: Error code (returned on failure)
        message:
          type: string
          nullable: true
          description: Error message (returned on failure)
        bindTime:
          type: integer
          format: int64
          description: Join timestamp (milliseconds, UTC)

    DeviceBindResultResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceBindResultItem'
      example:
        type: DeviceBindResultResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000017"
        code: 0
        message: success
        data:
          - deviceId: "subdevice-001"
            deviceName: "Bedroom Temperature Sensor"
            protocols: [zigbee]
            gatewayId: "gateway-001"
            code: 0
            message: null
            bindTime: 1710001235000

    DeviceTypesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceType'
      example:
        type: GetDeviceTypeInfosResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000006"
        code: 0
        message: success
        data:
          - deviceType: "light"
            name: "Light"
          - deviceType: "switch"
            name: "Switch"

    DevicesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceListData'
      example:
        type: GetDeviceInfoResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000007"
        code: 0
        message: success
        data:
          totalCount: 3
          pageNum: 1
          pageSize: 200
          data:
            - deviceId: "device-001"
              gatewayId: "gateway-001"
              deviceName: "Living Room Light"
              deviceTypesList: ["light"]
              createTime: 1710001234567
              state: true
              space:
                parentSpaceId: "space-home-001"
                spaceId: "space-room-001"
                name: "Living Room"

    DeviceListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: Total number of devices that meet the conditions
          example: 3
        pageNum:
          type: integer
          description: Current page number
          example: 1
        pageSize:
          type: integer
          description: Current page size
          example: 200
        data:
          type: array
          description: List of devices on the current page
          items:
            $ref: '#/components/schemas/DeviceInfo'

    # ── Firmware ───────────────────────────────────────────────────
    SearchUpgradableFirmwareByDeviceIdsRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SearchUpgradableFirmwareByDeviceIdsRequestData'

    SearchUpgradableFirmwareByDeviceIdsRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: List of device IDs, at least 1, at most 200.
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
        includeDeviceTypes:
          type: array
          description: List of device types to include. If empty, acts as default (no whitelist filtering).
          uniqueItems: true
          items:
            type: string
        excludeDeviceTypes:
          type: array
          description: List of device types to exclude. If empty, acts as default (no blacklist filtering).
          uniqueItems: true
          items:
            type: string

    UpgradeFirmwareFile:
      type: object
      required: [firmwareVersion, filePath, firmwareMd5, fileSize, firmwareType, option]
      properties:
        firmwareVersion:
          type: string
          description: Target firmware version
        filePath:
          type: string
          format: uri
          description: Firmware download URL
        firmwareMd5:
          type: string
          description: Firmware file MD5
        fileSize:
          type: integer
          format: int64
          minimum: 1
          description: Firmware file size, in bytes
        firmwareType:
          type: string
          description: Firmware partition type, e.g. main, studio
        option:
          type: integer
          description: Upgrade option passed through to Hub OTA

    UpgradeFirmwareDevice:
      type: object
      required: [did, firmware]
      properties:
        did:
          type: string
          description: Studio gateway device ID
        firmware:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UpgradeFirmwareFile'

    UpgradeFirmwareRequestData:
      type: array
      minItems: 1
      maxItems: 1
      description: The upgrade_handler process only processes one device at a time.
      items:
        $ref: '#/components/schemas/UpgradeFirmwareDevice'

    UpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
            code:
              type: integer
              description: OTA request result code, 0 means upgrade request accepted
      example:
        type: UpgradeFirmwareResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data: {}

    DevicePointHistoryQueryRequest:
      type: object
      properties:
        deviceIds:
          type: array
          description: List of device IDs, up to 200. If omitted or empty array, query all accessible current devices in the current request context.
          maxItems: 200
          default: []
          items:
            type: string
        traitCodes:
          type: array
          description: List of trait codes, up to 200. If omitted or empty array, there is no trait filter. If non-empty but all are not recognized as traits, parameter error is returned.
          maxItems: 200
          default: []
          items:
            type: string
        startTime:
          type: integer
          format: int64
          minimum: 0
          description: Query start time, Unix millisecond timestamp, inclusive.
        endTime:
          type: integer
          format: int64
          minimum: 0
          description: Query end time, Unix millisecond timestamp, exclusive; must be greater than startTime, max range 7 days.
        descending:
          type: boolean
          default: true
          description: true for descending order by time, false for ascending; must remain same in a cursor chain.
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: Max number of records per page, range 1–200.
        cursor:
          type: string
          nullable: true
          description: nextCursor returned by previous page, omit for initial query.

    DevicePointHistoryItem:
      type: object
      required: [deviceId, value, unit, time]
      properties:
        deviceId:
          type: string
          description: The device ID to which the historical record belongs.
        deviceName:
          type: string
          nullable: true
          description: Current device name; omitted if the device has been deleted or cannot be resolved.
        endpointId:
          type: integer
          format: int32
          nullable: true
          description: Current point endpoint ID; omitted if the point has been deleted or remapped.
        functionCode:
          type: string
          nullable: true
          description: Current point function Spec code; omitted if cannot be resolved.
        traitCode:
          type: string
          nullable: true
          description: Trait Spec code of the history record; omitted if cannot be resolved.
        value:
          description: Typed JSON scalar; number, boolean, enum index, or string. NaN and positive/negative Infinity return null.
          oneOf:
            - type: number
            - type: boolean
            - type: string
              nullable: true
        valueName:
          type: string
          nullable: true
          description: The business display text for boolean and enum trait values; omitted if unmatched or untranslated.
        pointName:
          type: string
          nullable: true
          description: Current point name; omitted if cannot be resolved.
        triggerName:
          type: string
          nullable: true
          description: Current trigger node name; omitted if cannot be resolved.
        unit:
          type: string
          description: Unit of historical record.
        time:
          type: integer
          format: int64
          description: History record time, Unix millisecond timestamp.

    DevicePointHistoryQueryData:
      type: object
      required: [items, startTime, endTime]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DevicePointHistoryItem'
        nextCursor:
          type: string
          nullable: true
          description: Next page opaque cursor; empty or omitted indicates last page.
        startTime:
          type: integer
          format: int64
          description: Server-resolved query start time in Unix milliseconds. Reuse when continuing with cursor.
        endTime:
          type: integer
          format: int64
          description: Server-resolved query end time in Unix milliseconds. Reuse when continuing with cursor.

    DevicePointHistoryQueryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            type:
              type: string
              enum: [DevicePointHistoryQueryResponse]
            version:
              type: string
              enum: [v1]
            data:
              $ref: '#/components/schemas/DevicePointHistoryQueryData'
      example:
        type: DevicePointHistoryQueryResponse
        version: v1
        msgId: "history-query-1"
        code: 0
        message: success
        data:
          items:
            - deviceId: "device-001"
              deviceName: "Living room light"
              endpointId: 1
              functionCode: Light
              traitCode: OnOff
              value: true
              valueName: "On"
              pointName: "Switch"
              triggerName: "Automation"
              unit: ""
              time: 1770639800000
          startTime: 1770114300000
          endTime: 1770639900000
          nextCursor: "opaque-next-cursor"

    SearchFirmwareUpgradeStatusRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: List of device IDs, at least 1, at most 1000. Duplicate IDs are not illegal, the server will deduplicate before querying.
          minItems: 1
          maxItems: 1000
          items:
            type: string

    FirmwareUpgradeStatusItem:
      type: object
      required: [did, progress, firmwareType, time]
      properties:
        did:
          type: string
          description: Device ID
        upgradeResult:
          type: integer
          nullable: true
          description: Upgrade result. null means upgrading, 0 means upgrade success, non-zero means upgrade failed.
        progress:
          type: integer
          description: Upgrade progress percent
          minimum: 0
          maximum: 100
        firmwareType:
          type: string
          description: Firmware type
        cause:
          type: string
          nullable: true
          description: Reason for failure. Returned when upgradeResult is not zero.
        time:
          type: integer
          format: int64
          description: Upgrade status update timestamp, in milliseconds

    SearchFirmwareUpgradeStatusResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: List of firmware upgrade statuses
          items:
            $ref: '#/components/schemas/FirmwareUpgradeStatusItem'

    SearchFirmwareUpgradeStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SearchFirmwareUpgradeStatusResponseData'
      example:
        type: SearchFirmwareUpgradeStatusResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data:
          items:
            - did: "device-001"
              upgradeResult: null
              progress: 50
              firmwareType: "main"
              cause: null
              time: 1710000000000
            - did: "device-002"
              upgradeResult: 0
              progress: 100
              firmwareType: "studio"
              cause: null
              time: 1710000001000

    CancelUpgradeFirmwareRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: List of device IDs, at least 1, at most 200. Duplicate IDs are not illegal, the server will deduplicate before sending.
          minItems: 1
          maxItems: 200
          items:
            type: string

    CancelUpgradeFirmwareResultItem:
      type: object
      required: [deviceId, resultCode]
      properties:
        deviceId:
          type: string
          description: Device ID
        resultCode:
          type: integer
          description: Cancel command dispatch result for a single device. 0 means command was sent to gateway successfully, not that cancel succeeded on the gateway; non-zero means command send failed.

    CancelUpgradeFirmwareResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: List of dispatch results for single device cancel commands
          items:
            $ref: '#/components/schemas/CancelUpgradeFirmwareResultItem'

    CancelUpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CancelUpgradeFirmwareResponseData'
            code:
              type: integer
              description: Interface result code, 0 means succeeded; check data.items[].resultCode for individual device cancel result.
      example:
        type: CancelUpgradeFirmwareResponse
        version: v1
        msgId: "4"
        code: 0
        message: success
        data:
          items:
            - deviceId: "device-001"
              resultCode: 0
            - deviceId: "device-002"
              resultCode: -1

    SearchUpgradableFirmwareByDeviceIdsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              description: Search results for upgradable firmware per device
              required: [data]
              properties:
                data:
                  type: array
                  description: List of upgradable firmware results per device
                  items:
                    $ref: '#/components/schemas/UpgradableDeviceFirmwareItem'
      example:
        type: SearchUpgradableFirmwareByDeviceIdsResponse
        version: v1
        msgId: "2"
        code: 0
        message: success
        data:
          data:
            - deviceId: "device-001"
              deviceName: "Bedroom light"
              state: true
              space:
                parentSpaceId: "space-home-001"
                name: "Bedroom"
                spaceId: "15sd85"
              upgradableFirmwares:
                - firmwareVersion: "99.99.99"
                  intVersion: null
                  filePath: "https://xxx"
                  fileSize: 123456
                  firmwareMd5: "xx"
                  firmwareCRC32: "xx"
                  firmwareSha256: null
                  firmwareType: "main"
                  updateLog: "Firmware upgrade notes"
                  model: ""
                  isNecessary: false
                  isForce: false
                  state: 3
                  releaseTime: 1710001234567

    UpgradableFirmwareType:
      type: string
      description: Firmware type
      enum: [main, zigbee, ai, matter, studio, rs485]

    UpgradableFirmwareInfo:
      type: object
      required: [firmwareVersion, filePath, fileSize, firmwareMd5, firmwareCRC32, firmwareType, isNecessary, isForce, state]
      properties:
        firmwareVersion:
          type: string
          description: Firmware version number
        intVersion:
          type: integer
          nullable: true
          description: Integer version for Matter-type firmware
        filePath:
          type: string
          description: Firmware file URL
        fileSize:
          type: integer
          format: int64
          description: Firmware file size (bytes)
        firmwareMd5:
          type: string
          description: Firmware file MD5
        firmwareCRC32:
          type: string
          description: Firmware file CRC32
        firmwareSha256:
          type: string
          nullable: true
          description: Firmware file SHA256
        firmwareType:
          $ref: '#/components/schemas/UpgradableFirmwareType'
        updateLog:
          type: string
          nullable: true
          description: Firmware upgrade notes
        model:
          type: string
          nullable: true
          description: Device model
        isNecessary:
          type: boolean
          description: Whether this is a mandatory through-version. true is required, false is optional.
        isForce:
          type: boolean
          description: Whether the upgrade is forced
        state:
          type: integer
          description: Firmware state. 1 = Testing, 2 = Gray release, 3 = Released, 5 = Beta
          enum: [1, 2, 3, 5]
        releaseTime:
          type: integer
          format: int64
          nullable: true
          description: Firmware release effective time (milliseconds timestamp)

    UpgradableDeviceFirmwareItem:
      type: object
      required: [deviceId, deviceName, state, upgradableFirmwares]
      properties:
        deviceId:
          type: string
          description: Device ID
        deviceName:
          type: string
          description: Device name
        state:
          type: boolean
          description: Device online status
        space:
          $ref: '#/components/schemas/DeviceSpace'
          description: Device associated space
        upgradableFirmwares:
          type: array
          description: List of upgradable firmware for this device
    
          items:
            $ref: '#/components/schemas/UpgradableFirmwareInfo' 

    
    # ── Automation ────────────────────────────────────────────────
    AutomationDefinitionType:
      type: string
      enum: [SCRIPT_JSON]
      description: Automation definition type. The currently supported type is SCRIPT_JSON.

    AutomationSummary:
      type: object
      required: [automationId, name, enabled, definitionType, createTime]
      properties:
        automationId:
          type: string
          description: Automation ID.
        name:
          type: string
          description: Automation name.
        enabled:
          type: boolean
          description: "Whether it is enabled. true: enabled; false: disabled."
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: |
            Automation type, as follows: <br />
            - SCRIPT_JSON：**Flow** automation created via API.  
            - SCRIPT_TEXT：**Flow** automation created via Aqara Studio Web page.  
            - WHEN_IF_THEN：**Classic** automation.  
            - LEGACY_FLOW：**Flow** automation (legacy version).  
            - LEGACY_LINKAGE：**Logic** automation.  
            - OTHER：Other automation types.
        createTime:
          type: integer
          format: int64
          description: Creation time (UTC timestamp in milliseconds)
        manualTriggers:
          type: array
          nullable: true
          description: Only includes brief information for manually executable triggers; does not represent the complete trigger list. The complete rules are based on the config in the details.
          items:
            $ref: '#/components/schemas/AutomationManualTriggerBrief'
        space:
          allOf:
            - $ref: '#/components/schemas/SpaceNode'
          nullable: true
          description: The current associated space of the automation; if not associated with any space, it is null.

    AutomationManualTriggerBrief:
      type: object
      required: [triggerNodeId, triggerName]
      properties:
        triggerNodeId:
          type: string
          description: Manual trigger ID
        triggerName:
          type: string
          description: Manual trigger name

    AutomationManualTriggerInfo:
      type: object
      required: [automationId, automationName, triggerNodeId, triggerName, enabled, definitionType, createTime]
      properties:
        automationId:
          type: string
          description: Automation ID.
        automationName:
          type: string
          description: Automation name.
        triggerNodeId:
          type: string
          description: Manual trigger node ID.
        triggerName:
          type: string
          description: Manual trigger name.
        enabled:
          type: boolean
          description: Whether the automation is enabled.
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: Automation type.
        createTime:
          type: integer
          format: int64
          description: Creation time (UTC timestamp in milliseconds)
        space:
          allOf:
            - $ref: '#/components/schemas/SpaceNode'
          nullable: true
          description: The current associated space of the automation; only returned when `includeSpace` is true, and null if not associated with any space.

    AutomationDetails:
      allOf:
        - $ref: '#/components/schemas/AutomationSummary'
        - type: object
          properties:
            configFormat:
              type: string
              nullable: true
              enum: [JSON_AUTOMATION, FLOW_CANONICAL]
              description: >-
                The actual persistence format of config. SCRIPT_JSON typically returns
                JSON_AUTOMATION, and SCRIPT_TEXT typically returns FLOW_CANONICAL; this
                field may be omitted for other automation types or when there is no
                persisted definition.
            config:
              nullable: true
              description: >-
                The complete actual persisted definition; must be interpreted together
                with configFormat. This field may be omitted when there is no persisted
                definition. Protocol extension fields such as node-internal config are
                returned as-is, so callers should allow unknown fields.
              anyOf:
                - $ref: '#/components/schemas/JsonAutomationConfig'
                - $ref: '#/components/schemas/FlowCanonicalConfig'

    JsonAutomationConfig:
      type: object
      required: [automations]
      description: JSON automation definition created via OpenAPI.
      properties:
        metadata:
          $ref: '#/components/schemas/JsonAutomationMetadata'
        automations:
          type: array
          description: List of automation rules
          items:
            $ref: '#/components/schemas/JsonAutomationRule'

    JsonAutomationMetadata:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Automation name within the configuration
        description:
          type: string
          nullable: true
          description: Configuration description
        scope:
          type: array
          description: Device property definitions that can be referenced by data.ref
          items:
            $ref: '#/components/schemas/JsonAutomationDevicePropertyDefinition'

    JsonAutomationDevicePropertyDefinition:
      type: object
      required: [type, name, deviceId, endpointId, functionCode, traitCode]
      properties:
        type:
          type: string
          enum: [device.property]
        name:
          type: string
        deviceId:
          type: string
        endpointId:
          type: integer
        functionCode:
          type: string
        traitCode:
          type: string

    JsonAutomationRule:
      type: object
      required: [starters, actions]
      properties:
        name:
          type: string
          nullable: true
        starters:
          type: array
          description: List of triggers; the type of each item determines the remaining fields
          items:
            $ref: '#/components/schemas/JsonAutomationTypedItem'
        condition:
          allOf:
            - $ref: '#/components/schemas/JsonAutomationTypedItem'
          nullable: true
          description: >-
            Optional condition evaluated before actions are executed; the field name is
            the singular condition. Compound conditions of type and/or use a conditions
            array inside this object.
        actions:
          type: array
          description: List of actions executed in order; the type of each item determines the remaining fields
          items:
            $ref: '#/components/schemas/JsonAutomationTypedItem'

    JsonAutomationTypedItem:
      type: object
      required: [type]
      description: >-
        Polymorphic trigger, condition, or action for JSON_AUTOMATION. Fields other than
        type are determined by the specific type; the server returns the persisted
        content as-is.
      properties:
        type:
          type: string
          description: >-
            For example: property.event, time.schedule, manual, property.state, and, or,
            not, time.between, device.trait.write, device.command.call, delay
      additionalProperties: true

    FlowCanonicalConfig:
      type: object
      description: Complete automation definition used by the Studio frontend canvas.
      properties:
        kind:
          type: string
          enum: [flow.canonical]
        flowVersion:
          type: string
          description: Canvas definition version; the current implementation defaults to 2.0
        registryVersion:
          type: string
          description: Node registry version; the current implementation defaults to 2.0
        metadata:
          $ref: '#/components/schemas/FlowCanonicalMetadata'
        variables:
          type: array
          description: Canvas variable declarations; not a list of triggers, conditions, or actions
          items:
            $ref: '#/components/schemas/FlowCanonicalVariable'
        nodes:
          type: array
          description: >-
            All flow nodes. Semantics are identified by the type prefix: event.* for
            triggers, condition.* for conditions, and action.* for actions; array order
            does not represent execution order.
          items:
            $ref: '#/components/schemas/FlowCanonicalNode'
        edges:
          type: array
          description: >-
            Connections between node ports; used to determine the execution relationships
            among triggers, conditions, and actions
          items:
            $ref: '#/components/schemas/FlowCanonicalEdge'
        editor:
          $ref: '#/components/schemas/FlowCanonicalEditorState'

    FlowCanonicalMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    FlowCanonicalVariable:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true

    FlowCanonicalNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: Node ID, also referenced by edges and editor mappings
        type:
          type: string
          description: >-
            Node type; event.* indicates a trigger, condition.* indicates a condition,
            and action.* indicates an action
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        config:
          type: object
          description: Configuration specific to the node type; fields vary by type
          additionalProperties: true
        title:
          type: string
          nullable: true

    FlowCanonicalEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/FlowCanonicalPortRef'
        target:
          $ref: '#/components/schemas/FlowCanonicalPortRef'

    FlowCanonicalPortRef:
      type: object
      required: [node, port]
      properties:
        node:
          type: string
          description: FlowCanonicalNode.id
        port:
          type: string
          description: Node input or output port name

    FlowCanonicalEditorState:
      type: object
      description: Frontend canvas display state; not used to determine automation execution order
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalPosition'
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalEditorNode'

    FlowCanonicalPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    FlowCanonicalEditorNode:
      type: object
      properties:
        summary:
          type: string
        description:
          type: string
        label:
          type: string
        icon:
          type: string
        iconColor:
          type: string
        detail:
          type: object
          additionalProperties: true
        hidden:
          type: boolean

    AutomationListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: Total number of automations that meet the conditions
        pageNum:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Current page size
        data:
          type: array
          description: Automation list
          items:
            $ref: '#/components/schemas/AutomationSummary'

    CreateAutomationRequest:
      type: object
      required: [definitionType, config]
      properties:
        name:
          type: string
          description: Automation name
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: Name duplication handling strategy. If not passed or true, automatically add suffixes like (1), (2), etc. ; if false, return a name duplication error.
        definitionType:
          $ref: '#/components/schemas/AutomationDefinitionType'
        config:
          type: object
          description: JSON automation script, please refer to [JSON automation script definition](https://docs.aqara.com/docs/aqara-developer/data-export-api/reference/json-automation-script).
          additionalProperties: true

    UpdateAutomationRequest:
      type: object
      required: [updateMask]
      properties:
        name:
          type: string
          description: New name.
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: Name duplication handling strategy. If not passed or true, automatically add suffixes like (1), (2), etc. ; if false, return a name duplication error. This field does not need to be included in updateMask.
        enabled:
          type: boolean
          description: "New enabled state. true: enabled; false: disabled."
          nullable: true
        config:
          type: object
          description: New configuration. Only applicable to automations with `definitionType` of `SCRIPT_JSON`.  
          nullable: true
          additionalProperties: true
        updateMask:
          type: array
          description: |
            List of parameter names to be updated. Please make sure each item in <code>updateMask</code> has a corresponding new value provided in the data object.<br />
            **Note**: `name` and `enabled` are applicable to all automations. `config` is only applicable to automations with `definitionType` of `SCRIPT_JSON`.
          items:
            type: string
            enum: [name, enabled, config]

    UpdateAutomationStatusRequest:
      type: object
      required: [automationIds, enabled]
      properties:
        automationIds:
          type: array
          description: List of automation IDs.
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          description: "New enabled state. true: enabled; false: disabled."

    UpdateAutomationSpaceRequest:
      type: object
      required: [spaceId, automationIds]
      properties:
        spaceId:
          type: string
          minLength: 1
          description: Target space ID.
        automationIds:
          type: array
          minItems: 1
          description: List of automation IDs to update the space association.
          items:
            type: string
      example:
        spaceId: "space-livingroom-001"
        automationIds: ["auto_01HXYZABCDEF1234567890"]

    DeleteAutomationsRequest:
      type: object
      required: [automationIds]
      properties:
        automationIds:
          type: array
          description: List of automation IDs.
          minItems: 1
          items:
            type: string

    AutomationBatchFailure:
      type: object
      required: [automationId, code, message]
      properties:
        automationId:
          type: string
          description: Automation ID.
        code:
          type: integer
          description: Error code.
        message:
          type: string
          description: Error message.

    AutomationBatchResultData:
      type: object
      required: [successIds, failedItems]
      properties:
        successIds:
          type: array
          description: List of successfully updated automation IDs.
          items:
            type: string
        failedItems:
          type: array
          description: List of failed automation objects.
          items:
            $ref: '#/components/schemas/AutomationBatchFailure'

    CreateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Automation ID.

    UpdateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true
              example: ""

    DeleteAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'

    QueryAutomationManualTriggerListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              description: List of manual triggers
              items:
                $ref: '#/components/schemas/AutomationManualTriggerInfo'

    ExecuteAutomationManualTriggerRequest:
      type: object
      required: [automationId, triggerNodeId]
      properties:
        automationId:
          type: string
          description: Automation ID.
        triggerNodeId:
          type: string
          description: ID of the manual trigger to be executed.

    ExecuteAutomationManualTriggerResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'

    UpdateAutomationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'

    UpdateAutomationSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
      example:
        type: UpdateAutomationSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000026"
        code: 0
        message: success
        data:
          successIds: ["auto_01HXYZABCDEF1234567890"]
          failedItems: []

    AutomationDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationDetails'
              nullable: true

    AutomationListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationListData'

    AutomationCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationCapabilitiesData'
      example:
        type: QueryAutomationCapabilitiesResponse
        version: v1
        msgId: "52ebd835-1b8d-48f7-ab30-741d7c1ae0ee"
        code: 0
        message: success
        data:
          devices:
            - deviceId: "lumi3.a61fca0f4da1a0bd"
              deviceName: "Edge Hub M300"
              endpoints:
                - endpointName: "Root"
                  endpointId: 1
                  properties:
                    - deviceType: "Root"
                      functionCode: "GeneralDiagnostics"
                      functionName: "GeneralDiagnostics"
                      traitCode: "AntiDeletionNotification"
                      traitName: "Accidental Deletion Prevention notification (child device)"
                      valueType: "event"
                      semanticRole: ["starter"]
                      valueRange:
                        enumRange:
                          - value: "1"
                            key: "trigger"

    AutomationCapabilitiesData:
      type: object
      nullable: true
      properties:
        devices:
          type: array
          description: List of device capabilities that can be used for automation orchestration
          items:
            $ref: '#/components/schemas/AutomationCapabilityDevice'

    AutomationCapabilityDevice:
      type: object
      required: [deviceId, deviceName, endpoints]
      properties:
        deviceId:
          type: string
          description: Device ID
        deviceName:
          type: string
          description: Device name
        endpoints:
          type: array
          description: Endpoint list
          items:
            $ref: '#/components/schemas/AutomationCapabilityEndpoint'

    AutomationCapabilityEndpoint:
      type: object
      required: [endpointName, endpointId, properties]
      properties:
        endpointName:
          type: string
          description: Endpoint name
        endpointId:
          type: integer
          description: Endpoint ID
        properties:
          type: array
          description: List of available capabilities for the endpoint (traits/events/commands)
          items:
            $ref: '#/components/schemas/AutomationCapabilityProperty'

    AutomationCapabilityProperty:
      type: object
      required: [deviceType, functionCode, functionName, valueType, semanticRole]
      properties:
        deviceType:
          type: string
          description: Device type
        functionCode:
          type: string
          description: Function code
        functionName:
          type: string
          description: Function name
        traitCode:
          type: string
          description: Trait code (common when valueType is not cmd)
        traitName:
          type: string
          description: Trait name
        commandCode:
          type: string
          description: Command code (common when valueType is cmd)
        commandName:
          type: string
          description: Command name
        valueType:
          type: string
          description: Value type (e.g. boolean/number/enum/event/cmd)
        semanticRole:
          type: array
          description: Automation roles
          items:
            type: string
            enum: [starter, condition, action]
        unit:
          type: string
          description: Unit (e.g. %, °C, lx, etc.)
        valueRange:
          $ref: '#/components/schemas/AutomationCapabilityValueRange'

    AutomationCapabilityValueRange:
      type: object
      description: Value range or enum range
      properties:
        min:
          type: number
          format: double
          description: Minimum value
        max:
          type: number
          format: double
          description: Maximum value
        enumRange:
          type: array
          items:
            $ref: '#/components/schemas/AutomationCapabilityEnumItem'

    AutomationCapabilityEnumItem:
      type: object
      description: Enum range
      required: [value, key]
      properties:
        value:
          type: string
          description: Enum value (usually a string in the API response)
        key:
          type: string
          description: Enum display text

    # ── EMS (Energy Management System) ────────────────────────────
    EmsTrendDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1704153600000
        deviceId:
          type: string
          description: Device ID.
          example: "device_001"
        dimension:
          type: string
          description: Aggregation dimension.
          enum: ["1h", "1d", "month"]
          example: "1h"

    EmsTrendSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1706745600000
        spaceId:
          type: string
          description: Space ID (automatically identifies home or room).
          example: "room_001"
        dimension:
          type: string
          description: Aggregation dimension
          enum: ["1h", "1d", "month"]
          example: "1d"

    EmsTotalDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1704153600000
        deviceId:
          type: string
          description: Device ID.
          example: "device_001"

    EmsTotalSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1706745600000
        spaceId:
          type: string
          description: Space ID (It would be automatically identified as home or room).
          example: "home_001"

    EmsTrendPoint:
      type: object
      required: [startTime, value]
      properties:
        startTime:
          type: string
          description: |
            Start time, format depends on query dimension:
            - 1h: yyyyMMddHH
            - 1d: yyyyMMdd
            - month: yyyyMM
          example: "2024010100"
        value:
          type: number
          format: double
          description: Energy consumption value in kWh within the specified time interval
          example: 1.5

    EmsTotalData:
      type: object
      required: [totalValue]
      properties:
        totalValue:
          type: number
          format: double
          description: Total energy consumption within the time interval (kWh).
          example: 45.6

    EmsDeviceTrendResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EmsTrendPoint'
      example:
        type: EmsDeviceTrendResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f010"
        code: 0
        message: success
        data:
          - startTime: "2024010100"
            value: 1.5
          - startTime: "2024010101"
            value: 2.3

    EmsSpaceTrendResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EmsTrendPoint'
      example:
        type: EmsSpaceTrendResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f011"
        code: 0
        message: success
        data:
          - startTime: "20240101"
            value: 12.5
          - startTime: "20240102"
            value: 15.3

    EmsDeviceTotalResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsTotalData'
      example:
        type: EmsDeviceTotalResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f012"
        code: 0
        message: success
        data:
          totalValue: 45.6

    EmsSpaceTotalResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsTotalData'
      example:
        type: EmsSpaceTotalResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f013"
        code: 0
        message: success
        data:
          totalValue: 156.2
    
    EmsSummarySpaceRequest:
      type: object
      required: [spaceId]
      properties:
        spaceId:
          type: string
          description: Space ID (automatically identifies home or room)
          example: "home_001"

    EmsSummaryDeviceItem:
      type: object
      required: [did]
      properties:
        did:
          type: string
          description: Device ID
          example: "device_001"
        endpointId:
          type: array
          items:
            type: integer
          description: Endpoint ID list. Query all endpoints of the device when empty or not provided.
          example: [1, 2]

    EmsSummaryDevicesRequest:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmsSummaryDeviceItem'
          description: Device list

    EmsSummaryData:
      type: object
      required: [today, yesterday, week, month, year]
      properties:
        today:
          type: number
          format: double
          description: Today's energy consumption (kWh)
          example: 0.112
        yesterday:
          type: number
          format: double
          description: Yesterday's energy consumption (kWh)
          example: 2.221
        week:
          type: number
          format: double
          description: Energy consumption in the last 7 days (kWh)
          example: 5.222
        month:
          type: number
          format: double
          description: Energy consumption in the last 30 days (kWh)
          example: 9.221
        year:
          type: number
          format: double
          description: Energy consumption in the last 365 days (kWh)
     
          example: 230.229

    EmsSpaceSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsSummaryData'
      example:
        type: EmsSpaceSummaryResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f010"
        code: 0
        message: success
        data:
          today: 0.112
          yesterday: 2.221
          week: 5.222
          month: 9.221
          year: 230.229

    EmsDevicesSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsSummaryData'
      example:
        type: EmsDevicesSummaryResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f010"
        code: 0
        message: success
        data:
          today: 0.112
          yesterday: 2.221
          week: 5.222
          month: 9.221
          year: 230.229

    StudioStatisticsDimension:
      type: string
