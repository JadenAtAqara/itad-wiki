              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Resource]
      summary: Modify Known Resource Properties
      description: Only allows modification of fields declared as writable by both resource definition and runtime schema; all field checks must pass before writing, and if it fails, a rollback will be attempted. Sensitive fields can be written via dynamic schema, but successful responses will not echo the request value or historical value.
      operationId: updateResource
      x-idempotent: true
      x-retryable: conditional
      x-side-effects: config_update
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /actions/{command}:
    post:
      tags: [Resource]
      summary: Execute Resource Command
      description: |
        Execute the command declared in the resource type definition on the resource. The request body only allows `id` and `input`: id must be a non-empty string, input must be an object, and extra fields will be rejected.
        The specific input, output, and available commands are subject to the runtime definition returned by GET /resource-types/{type}.
        Common protocol resource commands: the id for create is `protocol:{protocolId}`; when creating a network, do not include parentId, when creating device/point, parentId is required;
        the id for discover is `protocol:{protocolId}`; the id for import is the discovery task resource ID; the id for delete is the resource ID to delete, input must be an empty object.
      operationId: executeResourceAction
      x-idempotent: false
      x-retryable: false
      x-side-effects: command_execute
      parameters:
        - name: command
          in: path
          required: true
          description: Command name returned by the resource type definition.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceActionRequest'
            examples:
              createNetwork:
                summary: POST /actions/create Create Modbus Network
                value:
                  id: protocol:modbus
                  input:
                    entityKind: network
                    name: Modbus TCP Network
                    config:
                      transport: tcp
                      host: 127.0.0.1
                      port: 1502
              createDevice:
                summary: POST /actions/create Create Device Under Network
                value:
                  id: protocol:modbus
                  input:
                    entityKind: device
                    parentId: network-resource-id
                    name: PLC-1
                    config:
                      unitId: 1
              discover:
                summary: POST /actions/discover Start Discovery
                value:
                  id: protocol:bacnet
                  input:
                    ownerKind: network
                    ownerId: network-resource-id
                    targetKind: device
                    options: {}
              import:
                summary: POST /actions/import Import Discovered Object
                value:
                  id: discovery-job-resource-id
                  input:
                    discoveryObjectIds: [discovery-object-id]
                    ownerId: network-resource-id
              delete:
                summary: POST /actions/delete Delete Protocol Resource
           
                value:
                  id: protocol-entity-resource-id
                  input: {}
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceOpenApiResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

