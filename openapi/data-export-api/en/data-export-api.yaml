        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /resource-types/{type}/resources:
    get:
      tags: [Resource]
      summary: Paginated Query Resource
      description: |
        Paginated query for resources of the specified type. Only filtering conditions declared in query.properties of the resource type definition can be used. Passing in undeclared query parameters will return 400.
        parentId is only applicable to hierarchical resources that declare this filter; protocolId is only applicable to protocol resources. page defaults to 1, pageSize defaults to 20, max 100.
        sort format is `field:asc` or `field:desc`, field must appear in query.sortable; if not passed, uses the resource type definition's defaultSort.
        Pagination results do not calculate total, hasMore indicates whether there is a next page. You can use GET /resource-types/{type} to get the current runtime rules before calling.
      operationId: queryResources
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/ResourceType'
        - name: parentId
          in: query
          required: false
          schema:
            type: string
        - name: protocolId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: id:asc
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /resources/{id}:
    get:
      tags: [Resource]
      summary: Read Known Resource
      description: Automatically identifies the resource type based on the globally unique resource ID. For protocol resources, returns properties, schema, and read-only health; properties do not include sensitive fields such as token, password, secret, credential, privateKey, apiKey, etc.
      operationId: getResource
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Success
