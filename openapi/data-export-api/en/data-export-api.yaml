    # ── Alarm ─────────────────────────────────────────────────────
    AlarmClass:
      type: string
      enum: [Info, Warning, Critical]
      description: Alarm severity level

    AlarmSourceState:
      type: string
      enum: [NORMAL, OFF_NORMAL, FAULT, ALERT]
      description: Alarm status

    AlarmInfo:
      type: object
      required:
        - uuid
        - deviceName
        - deviceId
        - devicePointName
        - alarmClass
        - alarmRuleName
        - alarmText
        - alarmValue
        - sourceState
        - alarmTime
      properties:
        uuid:
          type: string
          description: Unique identifier for the alarm record
          example: "alarm-uuid-001"
        deviceName:
          type: string
          description: Name of the alarm source device
          example: "Living Room Temperature & Humidity Sensor"
        deviceId:
          type: string
          description: Device ID
          example: "device-001"
        devicePointName:
          type: string
          description: Data point name
          example: "Temperature"
        alarmClass:
          $ref: '#/components/schemas/AlarmClass'
        alarmRuleName:
          type: string
          description: Name of the alarm rule
          example: "High Temperature Alarm"
        alarmText:
          type: string
          description: Alarm message text
          example: "Temperature exceeds threshold"
        alarmValue:
          type: string
          description: Alarm value / value description
          example: "32.5"
        sourceState:
          $ref: '#/components/schemas/AlarmSourceState'
        alarmTime:
          type: integer
          format: int64
          description: Alarm time (UTC millisecond timestamp)
          example: 1704100000000

    AlarmListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: Total number of alarms matching the criteria
          example: 2
        pageNum:
          type: integer
          description: Current page number
          example: 1
        pageSize:
          type: integer
          description: Current page size
          example: 200
        data:
          type: array
          description: List of alarms on the current page
          items:
            $ref: '#/components/schemas/AlarmInfo'

    AlarmsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlarmListData'
      example:
        type: GetAlarmListResponse
        version: v1
        msgId: "1751609244328"
        code: 0
        message: success
        data:
          totalCount: 2
          pageNum: 1
          pageSize: 200
          data:
            - uuid: "alarm-uuid-001"
              deviceName: "Living Room Temperature & Humidity Sensor"
              deviceId: "device-001"
              devicePointName: "Temperature"
              alarmClass: Warning
              alarmRuleName: "High Temperature Alarm"
              alarmText: "Temperature exceeds threshold"
              alarmValue: "32.5"
              sourceState: OFF_NORMAL
              alarmTime: 1704100000000
            - uuid: "alarm-uuid-002"
              deviceName: "Bedroom Smoke Sensor"
              deviceId: "device-002"
              devicePointName: "Smoke Concentration"
              alarmClass: Critical
              alarmRuleName: "Smoke Alarm"
              alarmText: "Smoke detected"
              alarmValue: "1"
              sourceState: OFF_NORMAL
              alarmTime: 1704110000000

    DeleteAlarmRequest:
      type: object
      required: [uuid]
      properties:
        uuid:
          type: string
          description: Unique identifier for the alarm record
          example: "alarm-uuid-001"
      example:
        uuid: "alarm-uuid-001"

    DeleteAlarmResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: boolean
              description: Whether the deletion was successful
              example: true
      example:
        type: DeleteAlarmResponse
        version: v1
        msgId: "1751609244329"
        code: 0
        message: success
        data: true

    AckAlarmsRequest:
      type: object
      required: [uuids]
      properties:
        uuids:
          type: array
          description: List of alarm record UUIDs
          minItems: 1
          items:
            type: string
          example: ["alarm-uuid-001", "alarm-uuid-002"]
        notes:
          type: string
          nullable: true
          description: Acknowledgment notes (optional)
          example: "Confirmed onsite"
      example:
        uuids: ["alarm-uuid-001", "alarm-uuid-002"]
        notes: "Confirmed onsite"

    AckAlarmsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: boolean
              description: Whether the acknowledgment was successful
              example: true
      example:
        type: AckAlarmsResponse
        version: v1
        msgId: "1751609244331"
        code: 0
        message: success
        data: true

    AckAlarmsByPointIdRequest:
      type: object
      required: [devicePointId]
      properties:
        devicePointId:
          type: string
