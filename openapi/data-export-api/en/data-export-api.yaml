  # ────────────────────────────────────────────────────────────────
  # Query Alarm Rule List
  # ────────────────────────────────────────────────────────────────
  /alarm-rules:
    get:
      tags: [Alarm]
      summary: Query Alarm Rule List
      description: |
        Query paginated alarm rule list (excluding template rules).
        Optionally filter by `ruleName` (case-insensitive, contains match).
      operationId: getAlarmRules
      x-skill-intent: alarm.rule.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters: 
        - name: ruleName
          in: query
          description: Fuzzy match keyword for rule name (optional, defaults to no filtering)
          required: false
          schema:
            type: string
          example: Temperature
        - name: pageNum
          in: query
          description: Page number
          required: false
          schema:
            type: integer
          example: 1
        - name: pageSize
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
          example: 200
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlarmRulesResponse'
              examples:
                alarmRulesPage:
                  value:
                    type: GetAlarmRuleListResponse
                    version: v1
                    msgId: "1751609244333"
                    code: 0
                    message: success
                    data:
                      totalCount: 2
                      pageNum: 1
                      pageSize: 200
                      data:
                        - ruleId: "rule-001"
                          ruleName: "High Temperature Alarm"
                          alarmClass: Warning
                          alarmText: "Temperature exceeds threshold"
                          alarmTarget: "Temperature"
                          delayToAlarmMs: 5000
                          delayToNormalMs: 10000
                          enabled: true
                          updatedBy: "admin"
                          updatedTime: 1704100000000
                        - ruleId: "rule-002"
                          ruleName: "Smoke Alarm"
                          alarmClass: Critical
                          alarmText: "Smoke Detected"
                          alarmTarget: "Smoke Concentration"
                          delayToAlarmMs: 0
                          delayToNormalMs: 0
                          enabled: true
                          updatedBy: "admin"
                          updatedTime: 1704110000000
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

# ══════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════
components:

  responses:
    BadRequestResponse:
      description: Request parameter error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000001"
              code: 400
              message: "Parameter xxx is required"
    UnauthorizedResponse:
      description: Unauthorized or authentication expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000002"
              code: 401
              message: "Token expired. Please generate a new token"
    ForbiddenResponse:
      description: No permission to access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example: 
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000003"
              code: 403
              message: "No permission to access this resource"
    ConflictResponse:
      description: The current resource state conflicts with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityResponse:
      description: The request format is correct, but the protocol, entity, or configuration is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000004"
              code: 404
              message: "Resource not found"
    TooManyRequestsResponse:
      description: Request frequency too high
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000005"
              code: 429
              message: "Request frequency too high"
    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000006"
              code: 500
              message: "Internal server error"
    BadGatewayResponse:
      description: Edge or Cloud command call failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 502
              message: "Edge or Cloud command call failed"
    ServiceUnavailableResponse:
      description: Service unavailable; usually indicates the current environment is Edge, or the Cloud service 'cloudlinkcloud' is not loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 503
              message: "Service temporarily unavailable"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <Token>"

  # Common request header parameters
  parameters:
    ResourceType:
      name: type
      in: path
      required: true
      description: "Stable external resource type, for example: system, protocol.network, protocol.device, protocol.point"
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      description: Globally unique resource ID; for both standard and protocol resources, use the id returned from the API as-is
      schema:
        type: string

  schemas:

    # ── Base Request / Response ───────────────────────────────────
    BaseResponse:
      type: object
      required: [type, version, msgId, code]
      properties:
        type:
          type: string
          description: Message type
        version:
          type: string
          description: API version
          example: v1
        msgId:
          type: string
          description: Message ID
        code:
          type: integer
          description: "Business status code, 0 indicates success"
        message:
          type: string
          description: Message

    ErrorResponse:
      description: Error response. Read code and message for details.
     
      allOf:
        - $ref: '#/components/schemas/BaseResponse'

    # ── Common ANode Resource ──────────────────────────────────────────
    ResourceUpdateRequest:
      type: object
      required: [properties]
      properties:
        properties:
          type: object
          minProperties: 1
          additionalProperties: true
          description: Whitelisted fields to be modified, using standard JSON scalars

    ResourceActionRequest:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: The opaque resource ID returned by the server
        input:
          type: object
          additionalProperties: true
          default: {}
          description: Command input parameters; specific fields are defined by the resource type's command schema

    ResourceOpenApiResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              nullable: true
              description: The synchronous result of a command or background task information, structure as defined by the resource command output schema

    ResourceHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, disabled, fault, down, stale, "null", alarm, overridden, unackedAlarm, unknown]
          description: Read-only status normalized based on current Studio enabled, status, and faultCause; does not actively probe devices
        enabled:
          type: boolean
        faultCause:
          type: string

    ResourceItem:
      type: object
      description: |
        For sequence resources, parsable historical effects are converted into properties.data.type=commands in lists and details.
        If parsing fails, ID, name, revision, binding, and original format are retained,
        and properties.data={"type":"unavailable","reason":"Effect data cannot be represented as commands"} is returned.
        Command steps or raw protocol bytes are not returned and storage is not modified. Unavailable resources prohibit attribute updates, assign, and retry.
        User configuration can still be unbound; if unbound, they can be deleted; only bindings with SYNCED and syncedRevision=revision can be started.
        Top-level "commands" of the resource are allowed operation names, which are different from the step effects in properties.data.commands.
        create/preview only accepts commands data, not unavailable.
        For sequence "assign" input, only deviceId is accepted, and always assigns the latest version; passing revision (including null) will be rejected.
      required: [id, type, properties]
      properties:
        id:
          type: string
        type:
          type: string
        protocolId:
          type: string
          description: Returned for protocol resources; not returned for regular ANode resources
        properties:
          type: object
          additionalProperties: true
          description: Collection of external attribute values; values use standard JSON scalars or business objects. Studio internal path/type/value wrappers are not returned, nor are sensitive configurations marked as writeOnly in dynamic schemas included.
        schema:
          type: object
          additionalProperties: true
          description: The dynamic configuration schema returned when reading a protocol resource by ID; sensitive fields are marked with sensitive=true, writeOnly=true, readable=false
        health:
          $ref: '#/components/schemas/ResourceHealth'

    ResourceTypeSummary:
      type: object
      required: [type, operations, commands]
      properties:
        type:
          type: string
        operations:
          type: array
          items:
            type: string
            enum: [query, get, update]
        commands:
          type: array
          items:
            type: string

    ResourceTypesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceTypeSummary'

    ResourceTypeResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              additionalProperties: true
              description: External resource type definition; protocol resources contain the dynamic configuration schema for each protocolId and a read-only health schema

    ResourceQueryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [type, items, page, pageSize, hasMore]
              properties:
                type:
                  type: string
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceItem'
                page:
                  type: integer
                  minimum: 1
                pageSize:
                  type: integer
                  minimum: 1
                hasMore:
                  type: boolean

    ResourceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/ResourceItem'
        

    # ── Space ────────────────────────────────────────────────────
    SpaceNode:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: Space ID
        parentSpaceId:
          type: string
          nullable: true
          description: Parent space ID
        name:
          type: string
          description: Space name
        spatialMarking:
          type: string
          nullable: true
          description: Space tag
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: Child space list (recursive structure)

    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        parentSpaceId:
          type: string
          nullable: true
          description: Parent space ID. When empty, a top-level (root) space will be created; if not empty, a child space will be created under the specified parent space.
        name:
          type: string
          minLength: 1
          description: Space name, cannot be an empty string.
      example:
        parentSpaceId: "space-home-001"
        name: "Living Room"

    CreateSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Space ID of the newly created space.
      example:
        type: CreateSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000006"
        code: 0
        message: success
        data: "space-livingroom-001"

    UpdateSpaceNameRequest:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: Space ID.
        name:
          type: string
          description: New space name.
      example:
        spaceId: "space-livingroom-001"
        name: "New Living Room"

    UpdateSpaceNameResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Empty string (Fixed).
      example:
        type: UpdateSpaceNameResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000007"
        code: 0
        message: success
        data: ""

    DeleteSpaceRequest:
      type: object
      required: [spaceId]
      properties:
        spaceId:
          type: string
          description: Space ID.
        deleteChildren:
          type: boolean
          default: false
          description: Whether to delete child spaces.
      example:
        spaceId: "space-livingroom-001"
        deleteChildren: false

    DeleteSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Empty string after successful deletion.
              example: ""
      example:
        type: DeleteSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000027"
        code: 0
        message: success
        data: ""

    SpacesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SpaceNode'
      example:
        type: GetSpacesResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000005"
        code: 0
        message: success
        data:
          - spaceId: "space-home-001"
            parentSpaceId: null
            name: "My Home"
            spatialMarking: "home"
            children:
              - spaceId: "space-floor1-001"
                parentSpaceId: "space-home-001"
                name: "First Floor"
                spatialMarking: "floor"
                children: []

    # ── Device ───────────────────────────────────────────────────
    DeviceType:
      type: object
      required: [deviceType, name]
      properties:
        deviceType:
          type: string
          description: Device type code
        name:
          type: string
          description: Device type name

    DeviceInfo:
      type: object
      required: [deviceId, deviceName, deviceTypesList, createTime, state]
      properties:
        deviceId:
          type: string
          description: Device ID
        gatewayId:
          type: string
          nullable: true
          description: Gateway ID to which the device belongs
        deviceName:
          type: string
          description: Device name
        deviceTypesList:
          type: array
          items:
            type: string
          description: Device type list
        createTime:
          type: integer
          format: int64
          description: Creation time (UTC timestamp in milliseconds)
        state:
          type: boolean
          description: Online status
        space:
          $ref: '#/components/schemas/DeviceSpace'

    DeviceSpace:
      type: object
      required: [parentSpaceId, spaceId, name]
      properties:
        parentSpaceId:
          type: string
          description: Parent space ID
        spaceId:
          type: string
          description: Space ID
        name:
          type: string
          description: Space name

    DeviceDefinition:
      type: object
      required: [deviceId, name, deviceTypesList, endpoints]
      properties:
        deviceId:
          type: string
          description: Device ID
        gatewayId:
          type: string
          nullable: true
          description: |
            The gateway ID to which this device is bound.
            If `gatewayId` equals `deviceId`, it indicates that this device is itself a gateway.
            If `gatewayId` is `null` or an empty string, it means this device is a directly connected gateway without subdevices or a third-party integrated device.
        name:
          type: string
          description: Device name
        deviceTypesList:
          type: array
          items:
            type: string
          description: Device type list
        endpoints:
          type: array
          description: Endpoint list
          items:
            $ref: '#/components/schemas/Endpoint'

    DeviceDefinitionsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceDefinition'
      example:
        type: GetDevicesResponse
        version: v1
        msgId: "17"
        code: 0
        message: success
        data:
          - deviceId: lumi3.86108040f2b03a4e
            name: Device-001
            gatewayId: lumi3.86108040f2b03a4e
            deviceTypesList: ["Hub"]
            endpoints:
              - endpointId: 1
                endpointName: Public
                deviceType: Public
                functions:
                  - functionCode: Identify
                    traits:
                      - traitCode: IdentifyType
                        parameter:
                          type: Enum
                          readable: true
                          writable: true
                          subscribable: true
                          supportedValues:
                            - key: None
                              value: 0
                            - key: Light
                              value: 1
                            - key: LEDIndicator
                              value: 2
                            - key: AudibleBeep
                              value: 3
                            - key: Display
                              value: 4
                            - key: Actuator
                              value: 5
                          unit: ""
                        value: 3
                        time: 0
                        pointName: Root - Identify Type
                        displayTags: ["3", "98"]
                    commands:
                      - commandCode: Identify
                        fields:
                          - fieldCode: IdentifyTime
                            parameter:
                              type: Integer
                              mandatory: false
                              min: 0
                              max: 86400
                              unit: S
                        description: Identify
                        pointName: Root - Identify
                        displayTags: ["1"]
              - endpointId: 2
                endpointName: Hub
                deviceType: Hub
                functions:
                  - functionCode: BridgeConfiguration
                    traits:
                      - traitCode: SupportedHubCapability
                        parameter:
                          type: Integer
                          readable: true
                          writable: false
                          subscribable: true
                          min: 0
                          max: 4294967295
                          unit: ""
                          step: 1
                        value: 103
                        time: 0
                        pointName: Hub - Supported Hub capability set
                        displayTags: ["98"]
                      - traitCode: BridgedNodeList
                        parameter:
                          type: List[X]
                          readable: true
                          writable: false
                          subscribable: true
                          unit: ""
                        value: ""
                        time: 0
                        pointName: Hub - Bridge Node List
                        displayTags: ["98"]
                    commands: []

    GetMatchedDeviceCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceDefinition'
              nullable: true
      example:
        type: GetMatchedDeviceCapabilitiesResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000009"
        code: 0
        message: success
        data:
