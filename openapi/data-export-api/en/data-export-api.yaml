              uuids: ["alarm-uuid-001", "alarm-uuid-002"]
              notes: "Acknowledged on site"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckAlarmsResponse'
              examples:
                ackAlarms:
