    AlarmRuleInfo:
      type: object
      required:
        - ruleId
        - ruleName
        - alarmClass
        - alarmText
        - alarmTarget
        - delayToAlarmMs
        - delayToNormalMs
        - enabled
        - updatedBy
        - updatedTime
      properties:
        ruleId:
          type: string
          description: Alarm rule ID
          example: "rule-001"
        ruleName:
          type: string
          description: Alarm rule name
          example: "High Temperature Alarm"
        alarmClass:
          $ref: '#/components/schemas/AlarmClass'
        alarmText:
          type: string
          description: Alarm message text
          example: "Temperature exceeds threshold"
        alarmTarget:
          type: string
          description: Alarm target (data point/ability display name)
          example: "Temperature"
        delayToAlarmMs:
          type: integer
          format: int64
          description: Alarm trigger delay (ms)
          example: 5000
        delayToNormalMs:
          type: integer
          format: int64
          description: Recovery to normal delay (ms)
          example: 10000
        enabled:
          type: boolean
          description: Whether the rule is enabled
          example: true
        updatedBy:
          type: string
          description: Last updater
          example: "admin"
        updatedTime:
          type: integer
          format: int64
          description: Last update time (UTC millisecond timestamp)
          example: 1704100000000

    AlarmRuleListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: Total number of alarm rules matching the criteria
          example: 2
        pageNum:
          type: integer
          description: Current page number
          example: 1
        pageSize:
          type: integer
          description: Current page size
          example: 200
        data:
          type: array
          description: List of alarm rules on the current page
          items:
            $ref: '#/components/schemas/AlarmRuleInfo'

    AlarmRulesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AlarmRuleListData'
      example:
        type: GetAlarmRuleListResponse
        version: v1
        msgId: "1751609244333"
        code: 0
        message: success
        data:
          totalCount: 2
          pageNum: 1
          pageSize: 200
          data:
            - ruleId: "rule-001"
