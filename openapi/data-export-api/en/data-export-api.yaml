      summary: Query Resource Type Definition
      description: Returns the external field schema, query capabilities and operational capabilities, without exposing internal beanId or property path. Sensitive fields are marked with `sensitive=true`, `writeOnly=true`, or `readable=false`.
      operationId: describeResourceType
